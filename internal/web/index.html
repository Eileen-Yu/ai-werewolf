<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 狼人杀 · Werewolf</title>
<style>
  :root { color-scheme: dark; --bg:#14161c; --card:#1d2029; --line:#2c303b; --dim:#8b90a0; --accent:#e0a84a; --wolf:#d9534f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; font:15px/1.55 system-ui, -apple-system, "PingFang SC", sans-serif; background:var(--bg); color:#e6e6ea; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
  input, select, textarea, button { font:inherit; color:inherit; background:#11131a; border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:100%; }
  textarea { min-height: 110px; resize: vertical; }
  button { background:var(--accent); color:#14161c; border:none; font-weight:600; cursor:pointer; width:auto; padding:9px 18px; margin-top:12px; }
  button:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns: 1fr 360px; gap:16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .seats { display:flex; flex-wrap:wrap; gap:6px; }
  .seat { padding:4px 10px; border:1px solid var(--line); border-radius:999px; font-size:13px; }
  .seat.dead { opacity:.4; text-decoration: line-through; }
  .seat.sheriff { border-color: #d4a017; font-weight: 600; }
  .seat.me { border-color:var(--accent); color:var(--accent); }
  #log { max-height: 70vh; overflow-y:auto; }
  .line { padding:6px 0; border-bottom:1px solid var(--line); }
  .line .when { color:var(--dim); font-size:12px; margin-right:6px; }
  .line .who { font-weight:600; margin-right:4px; }
  .line.host .who { color:var(--dim); }
  .line.private { background: rgba(224,168,74,.07); }
  .line.mine .who { color:var(--accent); }
  .role { font-size:18px; font-weight:700; color:var(--accent); }
  .role.wolf { color:var(--wolf); }
  .dim { color:var(--dim); font-size:13px; }
  .err { color:var(--wolf); margin-top:8px; white-space: pre-wrap; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .mvp { font-size:17px; } .mvp b { color:var(--accent); }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:5px 12px; margin:10px 8px 0 0; }

  /* The stage: what the table is waiting on. Night brings a sky, the moon and,
     while the pack is at it, a pair of wolf eyes. */
  body { transition: background 1.2s; }
  body.night { background: radial-gradient(ellipse at top, #1a2148 0%, #0b0e1c 60%, #07080f 100%) fixed; }
  body.night .card { background: rgba(22,26,44,.88); border-color:#2a3157; }
  .seat.speaking { border-color:#7fd1ff; color:#bfe8ff; animation: ring 1.4s ease-out infinite; }
  @keyframes ring { 0% { box-shadow:0 0 0 0 rgba(127,209,255,.55); } 100% { box-shadow:0 0 0 9px rgba(127,209,255,0); } }
  .stage { position:relative; overflow:hidden; min-height:140px; display:flex; align-items:center; gap:16px; padding:22px 18px; }
  body.night .stage.night { background: linear-gradient(180deg, #070b22 0%, #141a40 100%); border-color:#2f3870; }
  .stage:not(.night) .moon { display:none; }
  .stage .sky { position:absolute; inset:0; pointer-events:none; opacity:0; transition: opacity 1s; }
  .stage.night .sky { opacity:1; }
  .stage .sky::before { content:""; position:absolute; inset:0;
    background-image: radial-gradient(1px 1px at 12% 20%, #fff, transparent), radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 80%, #fff, transparent),
      radial-gradient(1px 1px at 85% 45%, #fff, transparent), radial-gradient(1.5px 1.5px at 42% 12%, #fff, transparent),
      radial-gradient(1px 1px at 20% 88%, #fff, transparent), radial-gradient(1px 1px at 92% 15%, #fff, transparent);
    animation: twinkle 3s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity:.35; } to { opacity:1; } }
  .stage .moon { position:absolute; top:12px; right:16px; width:34px; height:34px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6, #f3dc8f 60%, #d9b75a); box-shadow: 0 0 22px 6px rgba(243,220,143,.35);
    animation: glow 4s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow:0 0 16px 4px rgba(243,220,143,.25); } to { box-shadow:0 0 30px 10px rgba(243,220,143,.45); } }
  .stage .body { position:relative; flex:1; }
  .stage .big { font-size:19px; font-weight:600; }
  .stage .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .stage .icon { position:relative; font-size:38px; width:64px; text-align:center; }
  .eyes { display:flex; gap:16px; justify-content:center; }
  .eyes span { width:16px; height:9px; border-radius:50% 50% 45% 45%; background:#ff3b30; box-shadow:0 0 10px 3px rgba(255,59,48,.75);
    animation: blink 3.2s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform:scaleY(1); } 95% { transform:scaleY(.1); } }
  .wave { display:inline-flex; gap:3px; align-items:flex-end; height:22px; margin-left:8px; vertical-align:middle; }
  .wave i { width:3px; background:#7fd1ff; border-radius:2px; animation: wave 1s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay:.15s; } .wave i:nth-child(3) { animation-delay:.3s; } .wave i:nth-child(4) { animation-delay:.45s; } .wave i:nth-child(5) { animation-delay:.6s; }
  @keyframes wave { 0%, 100% { height:5px; } 50% { height:22px; } }
  .dots::after { content:""; display:inline-block; width:1.4em; text-align:left; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content:""; } 25% { content:"."; } 50% { content:".."; } 75% { content:"..."; } }
  #rulesBtn { position:fixed; right:20px; bottom:20px; z-index:20; margin:0; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  #rules { position:fixed; right:20px; bottom:72px; z-index:20; width:min(420px, calc(100vw - 40px)); max-height:70vh; overflow-y:auto;
    margin:0; box-shadow:0 8px 32px rgba(0,0,0,.55); }
  #rules h3 { margin:0 0 8px; font-size:16px; } #rules h4 { margin:12px 0 4px; font-size:14px; color:var(--accent); }
  #rules p, #rules li { font-size:13.5px; margin:4px 0; } #rules ul { padding-left:18px; margin:4px 0; }
  #rulesClose { position:absolute; top:8px; right:10px; background:none; color:var(--dim); padding:4px 8px; margin:0; font-size:18px; }
  .ballot { display:inline-block; animation: drop 1.2s ease-in-out infinite; }
  @keyframes drop { 0%, 100% { transform:translateY(-4px); } 50% { transform:translateY(4px); } }
</style>
</head>
<body>
<main>
  <h1 id="title">AI 狼人杀</h1>

  <section id="setup" class="card" hidden>
    <label>Language / 语言</label>
    <select id="lang"><option value="zh">中文</option><option value="en">English</option></select>
    <label id="nameLabel"></label>
    <input id="name" maxlength="20">
    <label id="replacesLabel"></label>
    <select id="replaces"></select>
    <label id="tacticLabel"></label>
    <select id="tactic"></select>
    <button id="startBtn"></button>
    <div id="setupErr" class="err"></div>
  </section>

  <section id="table" hidden>
    <div class="grid">
      <div class="card"><div id="log"></div></div>
      <div>
        <div class="card">
          <div class="dim" id="when"></div>
          <div><span id="youAre"></span> <span id="role" class="role"></span></div>
          <div class="dim" id="pack"></div>
          <div class="seats" id="seats" style="margin-top:10px"></div>
          <button id="voiceBtn" class="secondary" type="button"></button>
        </div>
        <div class="card" id="votes" hidden></div>
        <div class="card" id="turnCard" hidden>
          <div id="turnTitle" style="font-weight:600"></div>
          <div class="dim" id="countdown"></div>
          <form id="turnForm"></form>
          <div id="turnErr" class="err"></div>
        </div>
        <div class="card stage" id="waiting"><div class="sky"></div><div class="moon"></div><div class="icon" id="stageIcon"></div><div class="body"><div class="big" id="stageText"></div><div class="sub" id="stageSub"></div></div></div>
        <div class="card" id="result" hidden></div>
      </div>
    </div>
  </section>
</main>
<button id="rulesBtn" class="secondary" type="button"></button>
<section id="rules" class="card" hidden><button id="rulesClose" type="button" aria-label="close">×</button><div id="rulesBody"></div></section>
<script>
const UI = {
  zh: {
    title: "AI 狼人杀", name: "你的名字", replaces: "替换哪个角色的座位", tactic: "狼队打法", random: "随机", start: "开始游戏",
    tactics: { counterclaim: "悍跳", deep_cover: "潜水", hook: "倒钩" },
    youAre: "你是", pack: "狼队：", waiting: "等待其他玩家……", dead: "你已出局，继续观战。", submit: "提交",
    timeLeft: s => `剩余 ${s} 秒，超时由AI代打`,
    kinds: { speech: "轮到你发言", rebuttal: "第二轮：回应和质疑", wolf_chat: "狼队夜聊", wolf_plan: "你来定今晚的计划",
      last_words: "留下遗言", vote: "投票放逐", inspect: "今晚查验谁", save: "要用解药救他吗", poison: "要用毒药吗", shoot: "开枪带走谁",
      run: "竞选警长：要上警吗", campaign: "警长竞选发言", withdraw: "竞选结束：要退水吗", sheriff_vote: "投票选警长", badge: "移交警徽" },
    run: "上警", noRun: "不上警", stay: "继续竞选", withdraw: "退水", tearBadge: "撕掉警徽", sheriff: "警长", sheriffBallot: "（警长，1.5票）",
    target: "选择", speech: "发言", planSpeech: "给队友的计划说明", suspect: "你怀疑谁（会记录在案）",
    claim: "声称身份（可选）", noClaim: "不声称", claimChecked: "查验了谁", claimResult: "查验结果", claimPotion: "救了/毒了谁",
    votes: w => `${w}票型`, abstain: "弃票", ballots: n => `${n}票`,
    faker: "谁来悍跳预言家", hook: "谁来倒钩（白天踩队友）", focus: "白天集中投谁（可选）", none: "（不选）",
    voiceOn: "🔊 语音朗读：开", voiceOff: "🔇 语音朗读：关", mic: "🎤 语音输入", micStop: "⏹ 停止录音", micErr: "语音输入出错：",
    micErrors: { "no-speech": "没听到声音。确认系统设置里选的输入设备是你在用的麦克风、没有静音，点 🎤 之后马上开始说。",
      "not-allowed": "浏览器没有麦克风权限：点地址栏左边的图标，允许使用麦克风后再试。",
      "audio-capture": "找不到麦克风：检查麦克风有没有连上、系统设置里有没有选它。",
      network: "语音识别连不上网络：Chrome 需要联网把录音发给 Google 识别。" },
    voiceReady: "语音朗读已开启，之后的发言会读出来。",
    over: "游戏结束", winner: w => `${w}胜利`, mvp: "MVP", failed: "游戏出错：", host: "主持人", again: "再来一局",
    rulesBtn: "📖 游戏规则",
    rules: `<h3>游戏规则</h3>
<p>标准9人局：3狼人、1预言家、1女巫、1猎人、3村民。你的身份随机发，只有你自己知道。</p>
<h4>夜晚</h4><ul>
<li>狼人睁眼商量，杀一个人，可以杀任何活着的人，包括自己和同伴（自刀）。</li>
<li>预言家查验一个人是好人还是狼人。</li>
<li>女巫知道谁被杀了：一瓶解药可以救他，一瓶毒药可以毒死任何人。两瓶各用一次，一晚最多用一瓶，只有第1夜能救自己。</li></ul>
<h4>天亮</h4><ul>
<li>主持人只公布谁死了，不说怎么死的。</li>
<li>猎人出局时可以开枪带走一个人，只能在白天开枪；被女巫毒死的不能开枪。开枪也不会公布，主持人只说又有谁死了。</li></ul>
<h4>警长（第1天）</h4><ul>
<li>想当警长的上警。上警的人轮流竞选发言，发言完可以退水。</li>
<li>没上警的人投票选警长；上警的人（包括退水的）不能投。只剩一个候选人时直接当选；平票、没人上警或都退水，就没有警长。</li>
<li>警长每天最后发言、可以归票，放逐票算1.5票。警长出局时可以把警徽交给活着的人，或者撕掉。</li></ul>
<h4>白天</h4><ul>
<li>每人发言一次，再每人回应一次，然后投票放逐一人。可以弃票；平票或都弃票，就没人出局。</li>
<li>被放逐的人留遗言。</li></ul>
<h4>胜负</h4><ul>
<li>好人：所有狼人出局。</li>
<li>狼人：村民全部出局，或神职（预言家、女巫、猎人）全部出局，或活着的狼人不少于其他人。</li></ul>
<h4>你怎么玩</h4><ul>
<li>轮到你时，右边会出现操作框；3分钟没操作，AI 会替你走这一步。</li>
<li>发言时要选你怀疑谁（会公开记录），也可以声称一个身份。狼人也可以假装成任何身份。</li></ul>`,
    stage: { wolves: "狼人正在密谋", wolvesSub: "天黑请闭眼，狼人请睁眼", night: "夜色深沉，有人正悄悄行动", nightIdle: "夜深了",
      wait: "主持人正在等待", speech: n => `${n} 正在发言`, rebuttal: n => `${n} 正在回应`, campaign: n => `${n} 正在竞选发言`,
      last_words: n => `${n} 正在留遗言`, badge: n => `${n} 正在决定警徽交给谁`, vote: "大家正在投票", sheriff_vote: "大家正在投票选警长",
      run: "大家正在决定要不要上警", withdraw: "候选人正在考虑要不要退水", left: n => `还有 ${n} 人在想`, elapsed: s => `已经 ${s} 秒` },
  },
  en: {
    title: "AI Werewolf", name: "Your name", replaces: "Whose seat to take", tactic: "Pack tactic", random: "Random", start: "Start game",
    tactics: { counterclaim: "Counterclaim", deep_cover: "Deep cover", hook: "Hook" },
    youAre: "You are", pack: "Your pack: ", waiting: "Waiting for the others…", dead: "You are out. Keep watching.", submit: "Submit",
    timeLeft: s => `${s}s left before an AI plays this for you`,
    kinds: { speech: "Your turn to speak", rebuttal: "Second round: answer and challenge", wolf_chat: "Wolf chat", wolf_plan: "Set tonight's plan",
      last_words: "Your last words", vote: "Vote someone out", inspect: "Who to check tonight", save: "Use the antidote on them?", poison: "Use the poison?", shoot: "Who to shoot",
      run: "Sheriff election: will you run?", campaign: "Your campaign speech", withdraw: "Campaign over: withdraw?", sheriff_vote: "Vote for sheriff", badge: "Pass on the badge" },
    run: "Run for sheriff", noRun: "Stay out", stay: "Stay in the race", withdraw: "Withdraw", tearBadge: "Tear up the badge", sheriff: "Sheriff", sheriffBallot: " (sheriff, 1.5 votes)",
    target: "Pick", speech: "What you say", planSpeech: "The plan, for your pack", suspect: "Who you suspect (goes on the record)",
    claim: "Claim a role (optional)", noClaim: "No claim", claimChecked: "Who you checked", claimResult: "What you saw", claimPotion: "Who you saved or poisoned",
    votes: w => `${w} votes`, abstain: "Abstained", ballots: n => `${n} vote${n === 1 ? "" : "s"}`,
    faker: "Who fakes the seer", hook: "Who plays the hook (turns on a packmate by day)", focus: "Who the pack votes tomorrow (optional)", none: "(none)",
    voiceOn: "🔊 Read aloud: on", voiceOff: "🔇 Read aloud: off", mic: "🎤 Speak", micStop: "⏹ Stop", micErr: "Voice input failed: ",
    micErrors: { "no-speech": "Heard nothing. Check that your system's input device is the microphone you are using and is not muted, and start talking right after clicking 🎤.",
      "not-allowed": "The browser has no microphone access: click the icon left of the address bar, allow the microphone, then try again.",
      "audio-capture": "No microphone found: check it is plugged in and selected in your system settings.",
      network: "Speech recognition cannot reach the network: Chrome sends the recording to Google to transcribe it." },
    voiceReady: "Read aloud is on. New lines will be read out.",
    over: "Game over", winner: w => `The ${w} side wins`, mvp: "MVP", failed: "The game failed: ", host: "Host", again: "Play again",
    rulesBtn: "📖 Rules",
    rules: `<h3>Rules</h3>
<p>A standard nine-player game: 3 werewolves, a seer, a witch, a hunter and 3 villagers. Your role is dealt at random, and only you know it.</p>
<h4>Night</h4><ul>
<li>The werewolves talk in private and kill one player: anyone alive, even one of their own.</li>
<li>The seer checks whether one player is good or a werewolf.</li>
<li>The witch learns who was killed: her antidote can save them, her poison can kill anyone. Each works once, at most one a night, and she may only save herself on the first night.</li></ul>
<h4>Dawn</h4><ul>
<li>The host only says who died, never how.</li>
<li>A hunter who is out may shoot one player, by day only, unless the witch poisoned him. The shot is not announced either: the host only says who else has died.</li></ul>
<h4>Sheriff (Day 1)</h4><ul>
<li>Whoever wants the badge runs. Candidates give a campaign speech and may then withdraw.</li>
<li>Those who never ran vote; candidates, even ones who withdrew, do not. A lone candidate wins without a vote; a tie, nobody running or everyone withdrawing means no sheriff.</li>
<li>The sheriff speaks last each day, may call the vote, and their vote counts 1.5. A sheriff who is out passes the badge to a living player or tears it up.</li></ul>
<h4>Day</h4><ul>
<li>Everyone speaks once, then replies once, then everyone votes someone out. You may abstain; a tie, or everyone abstaining, means nobody goes.</li>
<li>Whoever is voted out gets last words.</li></ul>
<h4>Winning</h4><ul>
<li>Good: every werewolf is out.</li>
<li>Werewolves: every villager is out, or every power role (seer, witch, hunter) is out, or the living werewolves are at least as many as everyone else.</li></ul>
<h4>How you play</h4><ul>
<li>On your turn a move box appears on the right; after three minutes, an AI plays the move for you.</li>
<li>When you speak, you pick who you suspect (it goes on the record) and may claim a role. Werewolves may claim anything.</li></ul>`,
    stage: { wolves: "The werewolves are plotting", wolvesSub: "Everyone close your eyes. Werewolves, open yours", night: "Deep in the night, someone is on the move", nightIdle: "Night falls",
      wait: "The host is waiting", speech: n => `${n} is speaking`, rebuttal: n => `${n} is answering`, campaign: n => `${n} is campaigning`,
      last_words: n => `${n} is saying last words`, badge: n => `${n} is passing on the badge`, vote: "Everyone is voting", sheriff_vote: "Everyone is voting for sheriff",
      run: "Everyone is deciding whether to run", withdraw: "The candidates are deciding whether to withdraw", left: n => `${n} still deciding`, elapsed: s => `${s}s so far` },
  },
};
const $ = id => document.getElementById(id);

// The rules panel opens and closes from a button in the corner, in the game's
// language, or the setup page's before a game starts.
let rulesLang = null;
function renderRules(lang) {
  if (lang === rulesLang) return; // the page redraws every poll; keep the reader's scroll
  rulesLang = lang;
  const t = UI[lang] || UI.zh;
  $("rulesBtn").textContent = t.rulesBtn;
  $("rulesBody").innerHTML = t.rules;
}
$("rulesBtn").onclick = () => { $("rules").hidden = !$("rules").hidden; };
$("rulesClose").onclick = () => { $("rules").hidden = true; };
const params = new URLSearchParams(location.search);
let gameId = params.get("game");
let shownEvent = null, logCount = 0, view = null, timer = null;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---- setup ----
async function loadSetup() {
  const lang = $("lang").value, t = UI[lang];
  renderRules(lang);
  $("title").textContent = t.title;
  $("nameLabel").textContent = t.name; $("replacesLabel").textContent = t.replaces;
  $("tacticLabel").textContent = t.tactic; $("startBtn").textContent = t.start;
  const { characters, tactics } = await api(`/api/characters?lang=${lang}`);
  $("replaces").innerHTML = characters.map(c => `<option>${esc(c)}</option>`).join("");
  $("tactic").innerHTML = `<option value="">${t.random}</option>` + tactics.map(x => `<option value="${x}">${t.tactics[x] || x}</option>`).join("");
}
$("lang").onchange = loadSetup;
$("startBtn").onclick = async () => {
  $("setupErr").textContent = "";
  try {
    const { id } = await api("/api/games", { lang: $("lang").value, name: $("name").value, replaces: $("replaces").value, tactic: $("tactic").value });
    location.search = `?game=${encodeURIComponent(id)}`;
  } catch (e) { $("setupErr").textContent = e.message; }
};

// ---- table ----
async function poll() {
  try {
    const g = await api(`/api/games/${encodeURIComponent(gameId)}`);
    if (g.view) render(g.view);
    if (g.result || g.error) { finish(g); return; }
  } catch (e) { $("stageText").textContent = e.message; }
  setTimeout(poll, 1500);
}

function render(v) {
  view = v;
  const t = UI[v.lang] || UI.zh, w = k => v.words[k] || k;
  document.title = $("title").textContent = t.title;
  renderRules(v.lang);
  $("voiceBtn").textContent = voice.on ? t.voiceOn : t.voiceOff;
  $("when").textContent = v.when;
  $("youAre").textContent = `${v.you}，${t.youAre}`;
  $("role").textContent = v.role;
  $("role").className = "role" + (v.pack ? " wolf" : "");
  $("pack").textContent = v.pack ? t.pack + v.pack.join(", ") : "";
  document.body.classList.toggle("night", v.phase === "night");
  const speaking = v.now && v.now.name;
  $("seats").innerHTML = v.seats.map(s => `<span class="seat${s.death ? " dead" : ""}${s.name === v.you ? " me" : ""}${s.sheriff ? " sheriff" : ""}${s.name === speaking ? " speaking" : ""}" title="${esc(s.death || (s.sheriff ? t.sheriff : ""))}">${s.sheriff ? "🎖️ " : ""}${esc(s.name)}</span>`).join("");
  renderVotes(v.lastVote, t);

  const log = $("log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  for (const l of v.log.slice(logCount)) {
    const d = document.createElement("div");
    d.className = "line" + (l.speaker ? "" : " host") + (l.private ? " private" : "") + (l.speaker === v.you ? " mine" : "");
    d.innerHTML = `<span class="when">${esc(l.when)}</span><span class="who">${esc(l.speaker || t.host)}:</span>${esc(l.text)}`;
    log.appendChild(d);
    if (l.speaker !== v.you) speakLine(l, v.lang);
  }
  logCount = v.log.length;
  if (atBottom) log.scrollTop = log.scrollHeight;

  renderStage(v, t);
  $("waiting").hidden = !!v.pending && !v.now;
  if (!v.pending) { $("turnCard").hidden = true; shownEvent = null; return; }
  if (v.pending.event !== shownEvent) showTurn(v.pending, t, w);
}

// renderStage shows what the table is waiting on: only what anyone at a real
// table could tell, which the game master has already narrowed it to.
let stageTimer = null;
function renderStage(v, t) {
  const s = t.stage, now = v.now, night = v.phase === "night";
  $("waiting").classList.toggle("night", night);
  let icon = "", text, sub = "";
  if (!now) {
    icon = night ? "💤" : "⏳";
    text = `<span class="dots">${esc(night ? s.nightIdle : t.waiting.replace(/[.…]+$/, ""))}</span>`;
    if (!v.alive) sub = t.dead;
  } else if (now.kind === "wolves") {
    icon = `<div class="eyes"><span></span><span></span></div>`;
    text = `<span class="dots">${esc(s.wolves)}</span>`; sub = s.wolvesSub;
  } else if (now.kind === "night" || now.kind === "wait") {
    icon = night ? "🦉" : "⏳";
    text = `<span class="dots">${esc(s[now.kind])}</span>`;
  } else if (now.name) {
    icon = now.kind === "badge" ? "🎖️" : "🎙️";
    const say = s[now.kind];
    text = esc(typeof say === "function" ? say(now.name) : now.name) + `<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>`;
  } else {
    icon = `<span class="ballot">🗳️</span>`;
    text = `<span class="dots">${esc(s[now.kind] || t.waiting)}</span>`;
    if (now.waiting > 1) sub = s.left(now.waiting);
  }
  $("stageIcon").innerHTML = icon;
  $("stageText").innerHTML = text;
  const since = now ? new Date(now.since) : null;
  const tick = () => {
    const secs = since ? Math.max(0, Math.round((Date.now() - since) / 1000)) : 0;
    $("stageSub").textContent = [sub, since ? s.elapsed(secs) : ""].filter(Boolean).join(" · ");
  };
  clearInterval(stageTimer);
  tick(); if (since) stageTimer = setInterval(tick, 1000);
}

// renderVotes shows a day's votes grouped by who they went to, most votes first.
function renderVotes(b, t) {
  const c = $("votes");
  c.hidden = !b;
  if (!b) return;
  const by = new Map();
  for (const x of b.votes) {
    const k = x.target || "";
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(x.voter);
  }
  const weight = voters => voters.reduce((n, v) => n + (v === b.sheriff ? 1.5 : 1), 0);
  const rows = [...by].sort(([p, x], [q, y]) => (p === "") - (q === "") || weight(y) - weight(x));
  c.innerHTML = `<div style="font-weight:600">${esc(t.votes(b.when))}</div>` + rows.map(([target, voters]) =>
    `<div class="line"><span class="who">${esc(target || t.abstain)}</span>` +
    (target ? `<span class="dim">${t.ballots(weight(voters))}</span>` : "") +
    `<div class="dim">← ${voters.map(v => esc(v) + (v === b.sheriff ? t.sheriffBallot : "")).join(", ")}</div></div>`).join("");
}

function showTurn(p, t, w) {
  shownEvent = p.event;
  const turn = p.turn, k = turn.kind, f = $("turnForm");
  $("turnCard").hidden = false; $("turnErr").textContent = "";
  $("turnTitle").textContent = t.kinds[k] || k;
  const opts = (xs, blank) => (blank ? `<option value="">${t.none}</option>` : "") + xs.map(x => `<option value="${esc(x)}">${esc(w(x))}</option>`).join("");
  const choice = ["vote", "wolf_plan", "inspect", "save", "poison", "shoot", "run", "withdraw", "sheriff_vote", "badge"].includes(k);
  const speaks = !choice || k === "wolf_plan", declares = ["speech", "rebuttal", "campaign"].includes(k);
  let h = "";
  if (k === "run") h += `<label>${t.target}</label><select name="target">${(turn.candidates || []).map(x => `<option value="${esc(x)}">${x === "pass" ? t.noRun : t.run}</option>`).join("")}</select>`;
  else if (k === "withdraw") h += `<label>${t.target}</label><select name="target">${(turn.candidates || []).map(x => `<option value="${esc(x)}">${x === "pass" ? t.withdraw : t.stay}</option>`).join("")}</select>`;
  else if (k === "badge") h += `<label>${t.target}</label><select name="target">${(turn.candidates || []).map(x => `<option value="${esc(x)}">${esc(x === "pass" ? t.tearBadge : w(x))}</option>`).join("")}</select>`;
  else if (choice) h += `<label>${t.target}</label><select name="target">${opts(turn.candidates || [])}</select>`;
  if (k === "wolf_plan" && turn.tactic === "counterclaim") h += `<label>${t.faker}</label><select name="faker">${opts([...(turn.pack || []), "nobody"])}</select>`;
  if (k === "wolf_plan" && turn.tactic === "hook") h += `<label>${t.hook}</label><select name="hook">${opts([...(turn.pack || []), "nobody"])}</select>`;
  if (k === "wolf_plan") h += `<label>${t.focus}</label><select name="focus">${opts(turn.suspects || [], true)}</select>`;
  if (declares) {
    const others = turn.seats.map(s => s.name).filter(n => n !== turn.me.name);
    h += `<label>${t.suspect}</label><select name="suspect">${opts(turn.suspects || [])}</select>`;
    h += `<label>${t.claim}</label><select name="claimRole"><option value="">${t.noClaim}</option>${opts(["seer", "witch", "hunter", "villager"])}</select>`;
    h += `<div class="row" id="claimDetail"><div><label id="claimTargetLabel"></label><select name="claimTarget">${opts(others, true)}</select></div>`;
    h += `<div id="claimResultBox"><label>${t.claimResult}</label><select name="claimResult">${opts(["good", "werewolf"], true)}</select></div></div>`;
  }
  if (speaks) h += `<label>${k === "wolf_plan" ? t.planSpeech : t.speech}</label><textarea name="speech"></textarea>`;
  h += `<button type="submit">${t.submit}</button>`;
  f.innerHTML = h;
  if (speaks) addMic(f, view.lang, t);
  // A seer claim names who was checked and what they were; a witch claim names
  // who got a potion; other claims name nobody.
  const named = r => r === "seer" || r === "witch";
  if (declares) {
    const sync = () => {
      const r = f.elements.claimRole.value;
      $("claimDetail").hidden = !named(r);
      $("claimResultBox").hidden = r !== "seer";
      $("claimTargetLabel").textContent = r === "seer" ? t.claimChecked : t.claimPotion;
    };
    f.elements.claimRole.onchange = sync;
    sync();
  }
  f.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f)), a = {};
    for (const key of ["target", "speech", "suspect", "faker", "hook", "focus"]) if (d[key]) a[key] = d[key].trim();
    if (d.claimRole) a.claim = { role: d.claimRole, target: named(d.claimRole) ? d.claimTarget || "" : "", result: d.claimRole === "seer" ? d.claimResult || "" : "" };
    stopMic();
    f.querySelector("button[type=submit]").disabled = true;
    try { await api(`/api/games/${encodeURIComponent(gameId)}/moves`, { event: p.event, action: a }); $("turnCard").hidden = true; }
    catch (err) { $("turnErr").textContent = err.message; f.querySelector("button[type=submit]").disabled = false; }
  };
  clearInterval(timer);
  const tick = () => {
    const s = Math.max(0, Math.round((new Date(p.deadline) - Date.now()) / 1000));
    $("countdown").textContent = t.timeLeft(s);
  };
  tick(); timer = setInterval(tick, 1000);
}

function finish(g) {
  clearInterval(timer);
  stopMic();
  clearInterval(stageTimer);
  $("turnCard").hidden = true; $("waiting").hidden = true;
  const t = UI[(view && view.lang) || "zh"], r = $("result");
  r.hidden = false;
  if (g.error) { r.innerHTML = `<div class="err">${t.failed}${esc(g.error)}</div>`; return; }
  const res = g.result, w = k => (view && view.words[k]) || k;
  r.innerHTML = `<div style="font-weight:700">${t.over} · ${esc(t.winner(w(res.winner)))}</div>` +
    (res.mvp && res.mvp.name ? `<p class="mvp">${t.mvp}: <b>${esc(res.mvp.name)}</b></p><p>${esc(res.mvp.reason)}</p>` : "") +
    `<a href="/"><button>${t.again}</button></a>`;
}

// ---- voice ----
// Read-aloud uses the browser's speech synthesis and voice input its speech
// recognition, so nothing is sent through the game master. Read-aloud starts
// off: browsers only let a page speak after the person has clicked something.
// While the microphone is on, new lines wait in held rather than being spoken,
// so the microphone does not pick them up. Chrome's speechSynthesis.pause and
// resume are not used: after a resume it often stays silent until cancelled.
const voice = { on: false, recording: false, held: [] };
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

$("voiceBtn").onclick = () => {
  voice.on = !voice.on;
  const lang = (view && view.lang) || "zh", t = UI[lang];
  $("voiceBtn").textContent = voice.on ? t.voiceOn : t.voiceOff;
  if (!voice.on) { speechSynthesis.cancel(); return; }
  // Said at once, so the person hears read-aloud works before the next line.
  speakLine({ text: t.voiceReady }, lang);
};
$("voiceBtn").hidden = !window.speechSynthesis;

function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; }

// speakLine reads a new line of the log aloud, each character with a voice,
// pitch and pace of their own so the table can be followed by ear. Claim tags
// like 【声称预言家…】 are for reading, not for saying.
function speakLine(l, lang) {
  if (!voice.on || !window.speechSynthesis) return;
  const text = l.text.replace(/【[^】]*】|\[[^\]]*\]/g, "").trim();
  if (!text) return;
  if (voice.recording) { voice.held.push([l, lang]); return; }
  const u = new SpeechSynthesisUtterance(l.speaker ? `${l.speaker}：${text}` : text);
  u.lang = lang === "en" ? "en-US" : "zh-CN";
  // Prefer the exact accent (Mandarin over Cantonese, say) when there is one.
  const all = speechSynthesis.getVoices(), tag = x => x.lang.replace("_", "-");
  const exact = all.filter(x => tag(x) === u.lang);
  const voices = exact.length ? exact : all.filter(x => tag(x).startsWith(lang === "en" ? "en" : "zh"));
  const h = hash(l.speaker || "");
  // The host keeps the first voice; players share the rest when there are any.
  if (voices.length) u.voice = !l.speaker || voices.length === 1 ? voices[0] : voices[1 + h % (voices.length - 1)];
  if (l.speaker) {
    u.pitch = 0.7 + (h % 7) / 10;
    u.rate = 0.95 + ((h >> 3) % 4) / 10;
  }
  speechSynthesis.speak(u);
}

// addMic puts a voice-input button under the speech box: what the person says
// is typed into the box, where they can fix it before submitting. Read-aloud
// stops meanwhile and catches up afterwards.
function addMic(f, lang, t) {
  const box = f.elements.speech;
  if (!box || !Recognition) return;
  const b = document.createElement("button");
  b.type = "button"; b.className = "secondary"; b.textContent = t.mic;
  box.after(b);
  b.onclick = () => {
    if (rec) { stopMic(); return; }
    const before = box.value;
    rec = new Recognition();
    rec.lang = lang === "en" ? "en-US" : "zh-CN";
    rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => { box.value = before + [...e.results].map(x => x[0].transcript).join(""); };
    rec.onerror = e => { $("turnErr").textContent = t.micErrors[e.error] || t.micErr + e.error; };
    rec.onend = () => {
      rec = null; b.textContent = t.mic;
      voice.recording = false;
      for (const [l, lang] of voice.held.splice(0)) speakLine(l, lang);
    };
    voice.recording = true;
    if (window.speechSynthesis) speechSynthesis.cancel();
    $("turnErr").textContent = "";
    try { rec.start(); } catch (err) { $("turnErr").textContent = t.micErr + err.message; rec.onend(); return; }
    b.textContent = t.micStop;
  };
}

function stopMic() { if (rec) rec.stop(); }

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

if (gameId) { $("table").hidden = false; poll(); }
else { $("setup").hidden = false; loadSetup(); }
</script>
</body>
</html>
