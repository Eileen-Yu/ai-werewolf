<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 狼人杀 · Werewolf</title>
<style>
  :root { color-scheme: dark; --bg:#14161c; --card:#1d2029; --line:#2c303b; --dim:#8b90a0; --accent:#e0a84a; --wolf:#d9534f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; font:15px/1.55 system-ui, -apple-system, "PingFang SC", sans-serif; background:var(--bg); color:#e6e6ea; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
  input, select, textarea, button { font:inherit; color:inherit; background:#11131a; border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:100%; }
  textarea { min-height: 110px; resize: vertical; }
  button { background:var(--accent); color:#14161c; border:none; font-weight:600; cursor:pointer; width:auto; padding:9px 18px; margin-top:12px; }
  button:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns: 1fr 360px; gap:16px; align-items:start; }
  /* On a phone: the seats, then what the table is waiting on or your move,
     then the timeline, then the votes. */
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; gap:0; }
    .side { display:contents; }
    #result, #turnCard, #waiting { order:1; } .timeline { order:2; } #votes { order:3; }
  }

  /* The game stage: every seat at the table. */
  .boardHead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .boardHead .phase { font-size:17px; font-weight:700; }
  .boardHead .me { flex:1; min-width:180px; }
  .boardHead #voiceBtn { margin:0; }
  .seats { display:grid; grid-template-columns: repeat(9, 1fr); gap:8px; }
  .seats.twelve { grid-template-columns: repeat(6, 1fr); }
  @media (max-width: 860px) { .seats, .seats.twelve { grid-template-columns: repeat(5, 1fr); } }
  @media (max-width: 520px) { .seats, .seats.twelve { grid-template-columns: repeat(3, 1fr); } }
  .seat { position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 8px;
    border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.02); text-align:center; min-width:0; transition: opacity .4s; }
  .seat .name { font-size:13px; font-weight:600; line-height:1.25; min-height:2.5em; max-width:100%; overflow:hidden; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .seats .avatar { width:60px; height:60px; font-size:24px; }
  .seat .tags { display:flex; flex-wrap:wrap; justify-content:center; gap:3px; min-height:18px; }
  .tag { font-size:11px; line-height:16px; padding:0 6px; border-radius:999px; background:#2a2e3a; color:#c9ccd6; white-space:nowrap; }
  .tag.you { background:var(--accent); color:#14161c; font-weight:700; }
  .tag.person { background:#26344a; color:#a9cdf5; }
  .tag.wolf { background:#4a2224; color:#ffb3b0; }
  .tag.out { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .tag.revealed { background:#3a3320; color:var(--accent); }
  .tag.revealed.wolf { background:#4a2224; color:#ffb3b0; }
  .avatar { position:relative; flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
    font-weight:700; font-size:18px; color:#fff; background:var(--c, #555); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .avatar.sm { width:30px; height:30px; font-size:13px; }
  .avatar img { position:absolute; inset:0; width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .avatar .badge { position:absolute; right:-6px; bottom:-4px; font-size:16px; }
  .avatar .state { position:absolute; left:-7px; top:-7px; font-size:15px; line-height:1; padding:3px; border-radius:50%; background:var(--card); }
  .seat.me { border-color:var(--accent); background:rgba(224,168,74,.08); }
  .seat.sheriff .avatar { box-shadow: 0 0 0 2px #d4a017; }
  .seat.dead .avatar, .seat.dead .name { opacity:.45; }
  .seat.dead .avatar { filter: grayscale(1); }
  .seat.dead .name { text-decoration: line-through; }

  /* The live timeline. */
  .timeline { position:relative; padding:0; }
  #log { max-height: max(360px, calc(100vh - 300px)); overflow-y:auto; padding:4px 16px 16px; }
  @media (max-width: 860px) { #log { max-height: 65vh; } }
  .group-head { position:sticky; top:0; z-index:1; margin:0 -16px 6px; padding:10px 16px 6px; font-size:13px; font-weight:700;
    color:var(--dim); letter-spacing:.03em; background:var(--card); border-bottom:1px solid var(--line); }
  body.night .group-head { background: #161a2c; }
  .group-head.night { color:#a7b4ff; } .group-head.dawn { color:#f2b97c; } .group-head.election { color:#e8c45a; }
  .group-head.day { color:#e6e6ea; } .group-head.end { color:var(--accent); }
  .msg { display:flex; gap:8px; margin:10px 0; align-items:flex-start; }
  .bubble { min-width:0; flex:1; }
  .bubble .meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:13px; }
  .bubble .meta b { font-size:14px; }
  .bubble .text { margin-top:3px; padding:8px 11px; border-radius:4px 12px 12px 12px; background:#252936; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.mine .bubble .text { background:#3a3320; }
  .msg.mine .meta b { color:var(--accent); }
  .msg.private .bubble .text { background:#3a2023; border:1px dashed #7a3a3d; }
  .chip { font-size:11.5px; padding:1px 7px; border-radius:999px; border:1px solid #4a5068; color:#c3c8dc; }
  .chip.claim { border-color:var(--accent); color:var(--accent); }
  /* What a speech put on the record comes before its words. */
  .stance { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; padding:2px 10px 2px 8px; border-radius:999px; }
  .pill.claim { background:#3a3320; color:var(--accent); }
  .pill.claim.wolfish { background:#4a2224; color:#ffb3b0; }
  .pill.suspect { background:#2f2230; color:#f0b5c8; }
  .pill.suspect.none { background:#262a36; color:var(--dim); font-weight:500; }
  .pill .avatar.sm { width:20px; height:20px; font-size:10px; }
  /* A speech's summary is the game master's, not the speaker's, under
     the words. The latest few and the one being read stay open; older ones
     fold to a single line that still shows how the summary starts. */
  .sum { margin-top:4px; font-size:13.5px; color:#c9ccd6; }
  .sum summary { display:flex; gap:6px; align-items:baseline; min-width:0; cursor:pointer; font-size:12px; color:#8fb3cc; list-style:none;
    padding:1px 8px; border-radius:6px; opacity:.8; }
  .sum summary::-webkit-details-marker { display:none; }
  .sum summary .lbl { flex:none; }
  .sum summary .pv { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); }
  .sum summary:hover { opacity:1; background:rgba(127,209,255,.06); }
  .sum[open] { background:rgba(127,209,255,.06); border-left:2px solid #4f7da0; border-radius:0 6px 6px 0; padding:4px 10px 6px; }
  .sum[open] summary { padding:0; background:none; margin-bottom:2px; opacity:1; }
  .sum[open] summary .pv { display:none; }
  .logbar { display:flex; justify-content:flex-end; padding:8px 16px 0; }
  .logbar button { margin:0; padding:3px 12px; font-size:12.5px; }
  .at { font-weight:700; color:#e6e6ea; background:rgba(255,255,255,.07); border-radius:3px; padding:0 2px; }
  .at.hit { color:#ffb3c6; background:rgba(240,120,150,.16); }
  .msg.reading .bubble .text { box-shadow: inset 3px 0 0 #7fd1ff; }
  .host { margin:8px 0; color:var(--dim); font-size:13.5px; white-space:pre-wrap; }
  .host.private { color:#e9cf9b; padding:6px 10px; border-radius:8px; background:rgba(224,168,74,.08); }
  .event { margin:10px 0; padding:8px 12px; border-radius:8px; border-left:3px solid; white-space:pre-wrap; }
  .event.death { border-color:var(--wolf); background:rgba(217,83,79,.12); font-weight:600; }
  .event.vote { border-color:#6f8cff; background:rgba(111,140,255,.10); font-size:14px; }
  .event.result { border-color:var(--accent); background:rgba(224,168,74,.10); font-weight:600; }
  /* Votes: the side panel keeps every result; a new one is revealed over the
     page, vote by vote, then its outcome. */
  #votes .vr-title { font-weight:700; margin-bottom:6px; }
  #votes details { border-top:1px solid var(--line); padding:8px 0; }
  #votes details:first-of-type { border-top:none; }
  #votes summary { cursor:pointer; font-size:13.5px; font-weight:600; list-style-position:outside; }
  #votes summary .dim { font-weight:400; }
  #votes .replay { margin:8px 0 0; padding:4px 12px; font-size:12.5px; }
  .vr-head { font-weight:700; font-size:16px; margin-bottom:6px; }
  .vr-note { font-size:12.5px; color:var(--dim); margin:2px 0 6px; }
  .vr-row { display:grid; grid-template-columns: minmax(0, 11em) 1fr 3.2em; gap:4px 10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); }
  .vr-name { display:flex; gap:6px; align-items:center; font-weight:600; min-width:0; }
  .vr-name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vr-bar { height:10px; border-radius:5px; background:#262a36; overflow:hidden; }
  .vr-bar i { display:block; height:100%; background:#6f8cff; border-radius:5px; transition: width .35s ease-out, background .4s; }
  .vr-count { text-align:right; font-variant-numeric: tabular-nums; font-weight:700; }
  .vr-voters { grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:4px; }
  .vr-voters:empty { display:none; }
  .vr-chip { font-size:12px; line-height:18px; padding:0 8px; border-radius:999px; background:#2a2e3a; color:#d6d9e2; white-space:nowrap; }
  .vr-chip.wait { display:none; }
  .vr-chip.pop { animation: pop .3s ease-out; }
  .vr-chip.sheriff { box-shadow: inset 0 0 0 1px #d4a017; color:#f3d27a; }
  .vr-chip.changed { background:#3b2c1a; }
  .vr-chip .chg { color:#ffb86b; margin-left:5px; }
  .vr-row.abstain .vr-name { color:var(--dim); font-weight:500; }
  .vr-row.win .vr-bar i { background:var(--wolf); }
  .vr-row.win.elected .vr-bar i { background:#d4a017; }
  .vr-row.tied .vr-bar i { background:var(--accent); }
  .vr-outcome { margin-top:12px; padding:10px 12px; border-radius:8px; border-left:3px solid var(--accent); background:rgba(224,168,74,.10); font-weight:700; }
  .vr-outcome.exiled { border-color:var(--wolf); background:rgba(217,83,79,.14); }
  .vr-outcome.wait { visibility:hidden; }
  .vr-outcome.landed { animation: stamp .45s ease-out; }
  #reveal { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(5,6,10,.7); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); animation: fade .25s; }
  #reveal .card { width:min(560px, 100%); max-height:88vh; overflow-y:auto; margin:0; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  #reveal .actions { display:flex; justify-content:flex-end; gap:8px; }
  #reveal .actions button { margin:12px 0 0; }
  @keyframes pop { from { opacity:0; transform:translateY(-6px) scale(.85); } to { opacity:1; transform:none; } }
  @keyframes stamp { from { opacity:0; transform:scale(1.12); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .vr-bar i, .vr-chip.pop, .vr-outcome.landed, #reveal { transition:none !important; animation:none !important; }
  }
  .sync { font-size:12px; padding:2px 10px; border-radius:999px; color:var(--dim); white-space:nowrap; }
  .sync.retry { background:#3a3320; color:var(--accent); }
  .sync.down { background:#4a2224; color:#ffb3b0; }
  #turnCard { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  /* The action bar: on your turn, what is asked and the time left; otherwise
     that it is not your turn yet. */
  #actionBar { position:fixed; z-index:25; left:50%; bottom:16px; transform:translateX(-50%); width:min(720px, calc(100vw - 190px));
    display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:12px; background:#232733; border:1px solid var(--line);
    box-shadow:0 8px 28px rgba(0,0,0,.55); }
  #actionBar .what { flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #actionBar .clock { font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; }
  #actionBar button { margin:0; }
  #actionBar .bar { position:absolute; left:0; right:0; bottom:0; height:3px; border-radius:0 0 12px 12px; overflow:hidden; }
  #actionBar .bar i { display:block; height:100%; background:var(--accent); transition: width 1s linear; }
  #actionBar.mine { background:#3a3320; border-color:var(--accent); }
  #actionBar.urgent { background:#4a2224; border-color:var(--wolf); }
  #actionBar.urgent .bar i { background:var(--wolf); }
  #actionBar.idle { color:var(--dim); font-size:13.5px; padding:8px 14px; }
  #actionBar.idle .what { font-weight:500; }
  @media (max-width: 860px) { #actionBar { width:calc(100vw - 24px); bottom:66px; } }
  main { padding-bottom:90px; }
  #votesNow { margin-bottom:8px; padding:8px 10px; border-radius:8px; background:rgba(111,140,255,.10); border-left:3px solid #6f8cff; font-size:13.5px; }
  #votesNow:empty { display:none; }
  #votes .prev { color:var(--accent); font-weight:700; }
  #newPill { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); margin:0; padding:6px 14px; border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,.5); z-index:2; }
  /* Who you are: a badge for your role, and a side the page wears quietly:
     the pack red, the power roles gold, the villagers the green of the
     fields. The side tints the top of the page, the board's edge and your
     seat, never the page itself. Day is warm, night is blue; at night only
     the pack's edge glows, since everyone else has their eyes shut. */
  body.side-wolf { --side: 217,83,79; } body.side-god { --side: 226,184,92; } body.side-villager { --side: 128,178,112; }
  body[class*="side-"]::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse 90% 40% at 50% -6%, rgba(var(--side),.16), transparent 72%); transition: opacity 1.2s; }
  body.night.side-god::before, body.night.side-villager::before { opacity:.45; }
  main { position:relative; z-index:1; }
  .me { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .rolebadge { display:inline-flex; align-items:center; gap:6px; font-size:16px; font-weight:700; padding:3px 12px 3px 8px; border-radius:999px;
    color:var(--accent); background:rgba(224,168,74,.12); border:1px solid rgba(224,168,74,.35); }
  .rolebadge .ico { font-size:18px; line-height:1; }
  .rolebadge.seer { color:#c9b6ff; background:rgba(150,120,255,.12); border-color:rgba(150,120,255,.35); }
  .rolebadge.witch { color:#9fe0b8; background:rgba(90,200,140,.10); border-color:rgba(90,200,140,.32); }
  .rolebadge.hunter { color:#f6b47c; background:rgba(240,150,80,.10); border-color:rgba(240,150,80,.32); }
  .rolebadge.villager { color:#d6d9e2; background:rgba(255,255,255,.05); border-color:var(--line); }
  .rolebadge.guard { color:#9cc8f0; background:rgba(90,150,220,.10); border-color:rgba(90,150,220,.32); }
  .rolebadge.werewolf, .rolebadge.wolfking { color:#ffb3b0; background:rgba(217,83,79,.14); border-color:rgba(217,83,79,.45); }
  .packmark { display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:#ffb3b0; padding:2px 8px 2px 6px; border-radius:999px; background:rgba(217,83,79,.08); }
  .packmark .avatar.sm { width:22px; height:22px; font-size:11px; box-shadow:0 0 0 1.5px rgba(217,83,79,.7); }
  .packmark .avatar.gone { filter:grayscale(1); opacity:.5; }
  .sidemark { font-size:12.5px; padding:2px 9px; border-radius:999px; color:rgb(var(--side)); background:rgba(var(--side),.10); }
  #board.side { border-color:rgba(var(--side),.32); box-shadow: inset 3px 0 0 rgba(var(--side),.75);
    background: linear-gradient(90deg, rgba(var(--side),.08), transparent 45%), var(--card); }
  body.night #board.side { box-shadow: inset 3px 0 0 rgba(var(--side),.5);
    background: linear-gradient(90deg, rgba(var(--side),.05), transparent 45%), rgba(22,26,44,.88); }
  body.night.side-wolf #board.side { box-shadow: inset 3px 0 0 rgba(var(--side),.9), 0 0 26px rgba(var(--side),.16);
    background: linear-gradient(90deg, rgba(var(--side),.10), transparent 45%), rgba(22,26,44,.88); }
  #board.side .seat.me { border-color:rgb(var(--side)); background:rgba(var(--side),.08); }
  #board.side .seat.me .tag.you { background:rgb(var(--side)); color:#14161c; }
  body.side-wolf #board.side .seat.me .tag.you { color:#fff; }
  .seat.mate { border-color:rgba(217,83,79,.45); }
  body.day { background: radial-gradient(ellipse at top, #2a2416 0%, var(--bg) 55%) fixed var(--bg); }
  .dim { color:var(--dim); font-size:13px; }
  .err { color:var(--wolf); margin-top:8px; white-space: pre-wrap; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .person { display:flex; gap:8px; align-items:center; margin-top:8px; } .person > span { width:4.5em; color:var(--dim); font-size:13px; } .person > input, .person > select { flex:1; }
  .link { padding:8px 0; border-bottom:1px solid var(--line); } .link code { word-break:break-all; font-size:12.5px; color:var(--dim); }
  .link button { margin:6px 8px 0 0; }
  .mvp { font-size:17px; } .mvp b { color:var(--accent); }
  button.danger { background:var(--wolf); color:#fff; }
  #blastCard { border-color:rgba(217,83,79,.45); }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:5px 12px; margin:10px 8px 0 0; }

  /* The stage: what the table is waiting on. Night brings a sky, the moon and,
     while the pack is at it, a pair of wolf eyes. */
  body { transition: background 1.2s; }
  body.night { background: radial-gradient(ellipse at top, #1a2148 0%, #0b0e1c 60%, #07080f 100%) fixed #07080f; }
  body.night .card { background: rgba(22,26,44,.88); border-color:#2a3157; }
  /* thinking: an AI is writing its move; speaking: its speech is being read aloud. */
  .seat.thinking { border-style:dashed; border-color:#5f8fb0; }
  .seat.speaking { border-color:#7fd1ff; background:rgba(127,209,255,.10); box-shadow:0 0 0 1px #7fd1ff, 0 0 18px rgba(127,209,255,.25); }
  .seat.speaking .avatar { animation: ring 1.4s ease-out infinite; }
  .seat .status { font-size:11px; line-height:16px; color:#7fd1ff; min-height:16px; }
  .seat.thinking .status { color:#8fb3cc; }
  @keyframes ring { 0% { box-shadow:0 0 0 0 rgba(127,209,255,.7); } 100% { box-shadow:0 0 0 11px rgba(127,209,255,0); } }
  .stage { position:relative; overflow:hidden; min-height:140px; display:flex; align-items:center; gap:16px; padding:22px 18px; }
  body.night .stage.night { background: linear-gradient(180deg, #070b22 0%, #141a40 100%); border-color:#2f3870; }
  .stage:not(.night) .moon { display:none; }
  .stage .sky { position:absolute; inset:0; pointer-events:none; opacity:0; transition: opacity 1s; }
  .stage.night .sky { opacity:1; }
  .stage .sky::before { content:""; position:absolute; inset:0;
    background-image: radial-gradient(1px 1px at 12% 20%, #fff, transparent), radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 80%, #fff, transparent),
      radial-gradient(1px 1px at 85% 45%, #fff, transparent), radial-gradient(1.5px 1.5px at 42% 12%, #fff, transparent),
      radial-gradient(1px 1px at 20% 88%, #fff, transparent), radial-gradient(1px 1px at 92% 15%, #fff, transparent);
    animation: twinkle 3s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity:.35; } to { opacity:1; } }
  .stage .moon { position:absolute; top:12px; right:16px; width:34px; height:34px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6, #f3dc8f 60%, #d9b75a); box-shadow: 0 0 22px 6px rgba(243,220,143,.35);
    animation: glow 4s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow:0 0 16px 4px rgba(243,220,143,.25); } to { box-shadow:0 0 30px 10px rgba(243,220,143,.45); } }
  .stage .body { position:relative; flex:1; }
  .stage .big { font-size:19px; font-weight:600; }
  .stage .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .stage .icon { position:relative; font-size:38px; width:64px; text-align:center; }
  .eyes { display:flex; gap:16px; justify-content:center; }
  .eyes span { width:16px; height:9px; border-radius:50% 50% 45% 45%; background:#ff3b30; box-shadow:0 0 10px 3px rgba(255,59,48,.75);

let rulesFor = null;
function renderRules(lang, board) {
  if (`${lang}:${board}` === rulesFor) return; // the page redraws every poll; keep the reader's scroll
  rulesFor = `${lang}:${board}`;
  const t = UI[lang] || UI.zh;
  $("rulesBtn").textContent = t.rulesBtn;
  $("rulesBody").innerHTML = t.rules(board);
}
$("rulesBtn").onclick = () => { $("rules").hidden = !$("rules").hidden; };
$("rulesClose").onclick = () => { $("rules").hidden = true; };
const params = new URLSearchParams(location.search);

const seatKey = params.get("seat") || "";
const seatQuery = `?seat=${encodeURIComponent(seatKey)}`;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), { status: r.status });
  return j;
}

// ---- setup ----
// One row per person: a name and whose seat to take, each row a different
// character to begin with. Names typed in are kept when the count changes.
let characters = [];
async function loadSetup() {
  const lang = $("lang").value, t = UI[lang], board = $("boardPick").value || "nine";
  renderRules(lang, board);
  $("title").textContent = t.title;
  $("boardLabel").textContent = t.board;
  $("boardPick").innerHTML = Object.entries(t.boards).map(([b, name]) => `<option value="${b}"${b === board ? " selected" : ""}>${esc(name)}</option>`).join("");
  $("countLabel").textContent = t.count;
  $("startBtn").textContent = t.start;
  let seats;
  ({ characters, seats } = await api(`/api/characters?lang=${lang}&board=${board}`));
  const n = String(Math.min(+($("count").value || "1"), seats));
  $("count").innerHTML = Array.from({ length: seats + 1 }, (_, i) => `<option value="${i}"${String(i) === n ? " selected" : ""}>${i ? i : esc(t.watchOnly(seats))}</option>`).join("");
  renderPeople(true);
}
function renderPeople(newCast) {
  const t = UI[$("lang").value], n = +$("count").value, rows = [...$("people").children];
  const names = rows.map(r => r.querySelector("input").value);
  const seats = newCast ? [] : rows.map(r => r.querySelector("select").value);
  $("people").innerHTML = Array.from({ length: n }, (_, i) =>
    `<div class="person"><span>${esc(t.player(i + 1))}</span><input maxlength="20" placeholder="${esc(t.name)}" value="${esc(names[i] || "")}">` +
    `<select>${characters.map(c => `<option${c === (seats[i] || characters[i]) ? " selected" : ""}>${esc(c)}</option>`).join("")}</select></div>`).join("");
}
$("lang").onchange = loadSetup;
$("boardPick").onchange = loadSetup;
$("count").onchange = () => renderPeople(false);
$("startBtn").onclick = async () => {
  $("setupErr").textContent = "";
  const humans = [...$("people").children].map(r => ({ name: r.querySelector("input").value, replaces: r.querySelector("select").value }));
  try {
    const g = await api("/api/games", { lang: $("lang").value, board: $("boardPick").value, humans });
    const link = s => `?game=${encodeURIComponent(g.id)}&seat=${encodeURIComponent(s.key)}`;
    if (!g.seats.length) { location.search = `?game=${encodeURIComponent(g.id)}`; return; }
    if (g.seats.length === 1) { location.search = link(g.seats[0]); return; }
    showLinks(g, link);

};

  for (const b of $("linkList").querySelectorAll("button[data-url]")) {
    b.hidden = !navigator.clipboard; // only on localhost or https
    b.onclick = async () => { await navigator.clipboard.writeText(b.dataset.url); b.textContent = t.copied; };
  }
}

// ---- table ----
// sync is how the page stands with the game master: in step, reconnecting
// after a failed poll, unavailable after a minute of them, or gone when the
// game master no longer knows the game. Failing, it polls less often.
const sync = { state: "connecting", last: 0, fails: 0 };
async function poll() {
  try {
    const g = await api(`/api/games/${encodeURIComponent(gameId)}${seatQuery}`);
    Object.assign(sync, { state: "ok", last: Date.now(), fails: 0 });
    if (g.view) render(g.view);
    if (g.result || g.error) { sync.state = "over"; renderSync(); finish(g); return; }
  } catch (e) {
    sync.fails++;
    sync.state = e.status === 404 ? "gone" : sync.last && Date.now() - sync.last > 60000 ? "down" : "retry";
    clearInterval(stageTimer);
    if (view) $("stageSub").textContent = (UI[view.lang] || UI.zh).sync.paused;
  }
  renderSync();
  setTimeout(poll, sync.fails ? Math.min(10000, 1500 * sync.fails) : 1500);
}

function renderSync() {
  const t = UI[(view && view.lang) || "zh"].sync, el = $("sync");
  const secs = Math.round((Date.now() - sync.last) / 1000);
  const ago = secs < 3 ? t.now : secs < 60 ? t.secs(secs) : t.mins(Math.floor(secs / 60));
  const at = sync.last ? new Date(sync.last).toLocaleTimeString([], { hour12: false }) : "—";
  el.className = "sync" + ({ retry: " retry", down: " down", gone: " down" }[sync.state] || "");
  el.textContent = sync.state === "ok" ? t.ok(ago) : sync.state === "connecting" ? t.connecting : sync.state === "over" ? t.over
    : sync.state === "gone" ? t.gone : t[sync.state](at, ago);
}
setInterval(() => { if (gameId) renderSync(); }, 1000);

// clock is a number of seconds as m:ss.
function clock(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function render(v) {
  view = v;
  const t = UI[v.lang] || UI.zh, w = k => v.words[k] || k;
  $("title").textContent = t.title;
  document.title = v.pending ? `${t.bar.title} · ${t.title}` : t.title;
  renderRules(v.lang, boardOf(v));
  $("voiceBtn").textContent = voice.on ? t.voiceOn : t.voiceOff;
  $("when").textContent = stageLabel(t, v.round, v.stage, v.phase);
  if (v.you) {
    $("youAre").textContent = v.lang === "en" ? `${v.you}, ${t.youAre}` : `${v.you}，${t.youAre}`;
    renderIdentity(v, t);
  } else {
    $("youAre").textContent = t.watching;
    $("role").hidden = $("pack").hidden = true;
    setSide("");
  }
  $("roleBtn").hidden = !v.you;
  $("roleBtn").textContent = t.roleBtn;
  document.body.classList.toggle("night", v.phase === "night");
  document.body.classList.toggle("day", v.phase !== "night");
  renderSeats(v, t);
  renderVotes(v, t);
  renderLog(v, t);
  renderStage(v, t);
  $("waiting").hidden = !!v.pending && (!v.now || v.now.name === v.you);
  if (v.you) { maybeDeal(v, t); dealTurn(v, t); }
  renderBlast(v, t);
  if (!v.pending) { $("turnCard").hidden = true; shownEvent = null; clearInterval(timer); renderBar(v, t); return; }
  if (v.pending.event !== shownEvent) showTurn(v.pending, t, w);
}

// renderIdentity is the seat's role as a badge and its side: for a werewolf
// the pack with a portrait each, a fallen packmate greyed out; for a power
// role a mark that it is one. The role comes in the game's words, so its key
// is found by its word.
const ROLE_ICON = { werewolf: "🐺", "white wolf king": "👑", seer: "🔮", witch: "🧪", hunter: "🏹", guard: "🛡️", villager: "🌾" };
const roleKey = v => Object.keys(ROLE_ICON).find(k => v.words[k] === v.role) || "";
const isWolf = key => key === "werewolf" || key === "white wolf king";
const sideOf = key => isWolf(key) ? "wolf" : key === "villager" ? "villager" : key ? "god" : "";
function renderIdentity(v, t) {
  const key = roleKey(v), side = sideOf(key);
  setSide(side);
  const role = $("role");
  role.hidden = false;
  role.className = "rolebadge " + (key === "white wolf king" ? "wolfking" : key);
  role.innerHTML = `<span class="ico">${ROLE_ICON[key] || "🎭"}</span>${esc(v.role)}`;
  const pack = $("pack");
  pack.hidden = side !== "wolf" && side !== "god";
  if (side === "god") {
    pack.className = "sidemark";
    pack.textContent = t.godSide;
  }
  if (side !== "wolf") return;
  const dead = new Set(v.seats.filter(s => s.death).map(s => s.name));
  pack.className = "packmark";
  pack.innerHTML = `🐺 ${esc(t.pack)} ` + (v.pack || []).filter(n => n !== v.you)
    .map(n => avatar(n, true, n === v.king ? `<span class="badge">👑</span>` : "")
      .replace('class="avatar sm"', `class="avatar sm${dead.has(n) ? " gone" : ""}" title="${esc(n === v.king ? `${n} · ${v.words["white wolf king"]}` : n)}"`)).join("");
}

// renderBlast is the white wolf king's button to blow up, while the game
// takes one: after each speech of the election, the day or a PK. The game
// stops offering it once it is pressed.
function renderBlast(v, t) {
  const card = $("blastCard"), f = $("blastForm");
  if (!v.blast) { card.hidden = true; delete f.dataset.event; return; }
  card.hidden = false;
  if (f.dataset.event === v.blast) return; // keep the pick across polls
  f.dataset.event = v.blast;
  $("blastTitle").textContent = t.blast.title;
  $("blastHint").textContent = t.blast.hint;
  $("blastBtn").textContent = t.blast.go;
  $("blastBtn").disabled = false;
  $("blastErr").textContent = "";
  const living = v.seats.filter(s => !s.death && s.name !== v.you).map(s => s.name);
  f.elements.target.innerHTML = `<option value="">${esc(t.blast.pick)}</option>` + living.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
}
$("blastForm").onsubmit = async e => {
  e.preventDefault();
  const f = $("blastForm"), t = UI[view.lang] || UI.zh, target = f.elements.target.value;
  if (!target || !confirm(t.blast.sure(target))) return;
  $("blastBtn").disabled = true;
  try { await api(`/api/games/${encodeURIComponent(gameId)}/moves${seatQuery}`, { event: f.dataset.event, action: { target } }); $("blastCard").hidden = true; }
  catch (err) { $("blastErr").textContent = err.message; $("blastBtn").disabled = false; }
};

// The deal is the card a seat flips over the first time its page sees its
// role, with what that role does by night and by day. It is remembered per
// game and seat, so a reload does not deal again; a role seen in an earlier
// game only flips, its guide a tap away. The role button opens it again.
const remembered = {
  has: k => { try { return localStorage.getItem(k) === "1"; } catch { return false; } },
  set: k => { try { localStorage.setItem(k, "1"); } catch {} },
};
let dealOpen = false;
function maybeDeal(v, t) {
  const key = roleKey(v), dealt = `werewolf-dealt:${gameId}:${seatKey}`;
  if (!key || dealOpen || remembered.has(dealt)) return;
  remembered.set(dealt);
  showDeal(v, t, true, !remembered.has(`werewolf-guide:${key}`));
}
function showDeal(v, t, spin, guide) {
  const d = t.deal, key = roleKey(v), side = sideOf(key);
  $("dealFront").className = "face front " + side;
  $("dealFront").innerHTML = `<div class="ico">${ROLE_ICON[key] || "🎭"}</div><div class="name">${esc(v.role)}</div><div class="camp">${esc(d.camps[side] || "")}</div>`;
  const mates = (v.pack || []).filter(n => n !== v.you);
  const mate = n => avatar(n, true) + esc(n) + (n === v.king ? ` 👑${esc(v.words["white wolf king"] || "")}` : "");
  $("dealMates").innerHTML = mates.length ? `<div class="mates">🐺 ${esc(d.mates)} ${mates.map(mate).join(" ")}</div>` : "";
  const b = boardOf(v), say = x => typeof x === "function" ? x(b) : x;
  const day = [d.days.all, d.days[key]].filter(Boolean);
  const parts = [[d.goal, [side === "wolf" ? say(d.goals.wolf) : d.goals.good]], [d.night, [say(d.nights[key])]], [d.day, day]];
  if (key === "hunter") parts.push([d.out, [d.hunterOut]]);
  const g = $("dealGuide");
  g.innerHTML = parts.map(([h, xs]) => `<h4>${esc(h)}</h4><ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("");
  g.hidden = !guide;
  const flip = $("dealFlip");
  flip.classList.remove("spin");
  if (spin) { void flip.offsetWidth; flip.classList.add("spin"); }
  $("dealMore").hidden = guide;
  $("dealMore").textContent = d.more;
  $("deal").hidden = false;
  dealOpen = true;
  dealTurn(v, t);
}
// dealTurn says, over the card, when the game is already waiting on this
// seat's move, so reading the guide on night 1 does not quietly run out the
// clock.
function dealTurn(v, t) {
  if (!dealOpen) return;
  const p = v.pending, el = $("dealTurn");
  el.hidden = !p;
  if (p) el.textContent = t.deal.turn(t.kinds[p.turn.kind] || p.turn.kind);
  $("dealClose").textContent = p ? t.deal.go : t.deal.close;
}
$("dealMore").onclick = () => { $("dealMore").hidden = true; $("dealGuide").hidden = false; };
$("dealClose").onclick = () => {
  remembered.set(`werewolf-guide:${roleKey(view)}`);
  $("deal").hidden = true;
  dealOpen = false;
  if (view.pending) $("turnCard").scrollIntoView({ behavior: "smooth", block: "center" });
};
$("roleBtn").onclick = () => { if (view && view.you) showDeal(view, UI[view.lang] || UI.zh, false, true); };

// setSide is which side the page wears: "wolf", "god", "villager", or "" to
// watch.
function setSide(side) {
  for (const s of ["wolf", "god", "villager"]) document.body.classList.toggle("side-" + s, s === side);
  $("board").classList.toggle("side", !!side);
}

// renderBar is the bar along the bottom for a seat at the table: on its turn
// what is asked and the time left, otherwise what the table is doing. On a
// person's turn showTurn keeps it ticking.
let stagePlain = "";
const MOVE_SECS = 300; // werewolf.HumanTimeout
function renderBar(v, t) {
  const bar = $("actionBar");
  bar.hidden = !v.you;
  if (!v.you) return;
  const p = v.pending;
  bar.classList.toggle("idle", !p);
  bar.classList.toggle("mine", !!p);
  $("barGo").hidden = !p; $("barClock").hidden = !p; $("barFill").parentElement.hidden = !p;
  if (!p) { bar.classList.remove("urgent"); $("barWhat").textContent = v.alive ? t.bar.notYet(stagePlain) : t.bar.out; return; }
  const k = p.turn.kind, left = Math.max(0, Math.round((new Date(p.deadline) - Date.now()) / 1000));
  $("barWhat").textContent = t.bar.yours(t.kinds[k] || k);
  $("barGo").textContent = t.bar.go;
  $("barClock").textContent = clock(left);
  $("barFill").style.width = `${Math.min(100, 100 * left / MOVE_SECS).toFixed(1)}%`;
  bar.classList.toggle("urgent", left < 30);
}
$("barGo").onclick = () => {
  $("turnCard").scrollIntoView({ behavior: "smooth", block: "center" });
  const first = $("turnForm").querySelector("select, textarea");
  if (first) first.focus({ preventScroll: true });
};

// stageLabel names a part of the game, e.g. "第2天 · 警长竞选". Events from
// before stages were kept fall back to their phase.
function stageLabel(t, round, stage, phase) {
  const k = stage || (phase === "night" ? "night" : "day");
  return t.stages[k](round);
}

// avatar is a character's portrait, or for anyone without one their initial
// on a colour of their own.
let portraits = {};
function avatar(name, small, badge) {
  const img = portraits[name] ? `<img src="${esc(portraits[name])}" alt="">` : "";
  return `<div class="avatar${small ? " sm" : ""}" style="--c:hsl(${hash(name) % 360} 45% 40%)">${esc([...name][0] || "?")}${img}${badge || ""}</div>`;
}

// renderSeats draws every seat: who is out, who has the badge, who is
// speaking, which seats people play, and only the roles this seat knows:
// its own and its pack's, or everyone's once the game is over.
let revealed = null; // every seat's role, once the game is over
function renderSeats(v, t, roles = revealed) {
  const thinking = v.now && v.now.name, speaking = reading && reading.speaker, people = v.people || [], pack = v.pack || [];
  const w = k => v.words[k] || k;
  $("seats").classList.toggle("twelve", v.seats.length > 9);
  $("seats").innerHTML = v.seats.map(s => {
    const me = s.name === v.you, tags = [];
    if (me) tags.push(`<span class="tag you">${esc(t.you)}</span>`);
    else if (people.includes(s.name)) tags.push(`<span class="tag person">${esc(t.person)}</span>`);
    if (roles) tags.push(`<span class="tag revealed${isWolf(roles[s.name]) ? " wolf" : ""}">${esc(w(roles[s.name]))}</span>`);
    else if (!me && pack.includes(s.name)) tags.push(`<span class="tag wolf">${esc(t.packmate)}</span>`);
    if (s.death) tags.push(`<span class="tag out">${esc(t.out)}</span>`);
    const state = s.name === speaking ? "speaking" : !roles && s.name === thinking ? "thinking" : "";
    const mate = !me && !roles && pack.includes(s.name);
    const cls = ["seat", s.death && "dead", me && "me", mate && "mate", s.sheriff && "sheriff", state].filter(Boolean).join(" ");
    return `<div class="${cls}" title="${esc([s.name, s.death || (s.sheriff ? t.sheriff : "")].filter(Boolean).join(" · "))}">` +
      avatar(s.name, false, s.sheriff ? `<span class="badge">🎖️</span>` : "") +
      `<div class="name">${esc(s.name)}</div><div class="status">${state ? esc(t.seatState[state]) : ""}</div><div class="tags">${tags.join("")}</div></div>`;
  }).join("");
}

// renderLog adds the lines this poll brought to the timeline, under a heading
// for each part of the game. It follows new lines only while the reader is
// at the bottom; scrolled up, they are counted on a button instead.
let group = null, groupKey = "", unseen = 0;
const GROUP_ICON = { night: "🌙", dawn: "🌅", election: "🎖️", day: "☀️", end: "🏁" };
function renderLog(v, t) {
  const log = $("log"), first = logCount === 0;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const fresh = v.log.slice(logCount);
  fresh.forEach((l, i) => { l.n = logCount + i; });
  for (const l of fresh) {
    const k = l.stage || (l.phase === "night" ? "night" : "day"), key = `${l.round}/${k}`;
    if (key !== groupKey) {
      groupKey = key;
      group = document.createElement("section");
      group.innerHTML = `<div class="group-head ${k}">${GROUP_ICON[k]} ${esc(stageLabel(t, l.round, k))}</div>`;
      log.appendChild(group);
    }
    group.insertAdjacentHTML("beforeend", lineHTML(l, v, t));
    if (l.speaker !== v.you) speakLine(l, v.lang);
  }
  logCount = v.log.length;
  foldSums();
  if (first || atBottom) { log.scrollTop = log.scrollHeight; unseen = 0; }
  else unseen += fresh.length;
  $("newPill").hidden = !unseen;
  $("newPill").textContent = t.newLines(unseen);
}
$("log").onscroll = () => {
  const log = $("log");
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 60) { unseen = 0; $("newPill").hidden = true; }
};
$("newPill").onclick = () => { const log = $("log"); log.scrollTo({ top: log.scrollHeight, behavior: "smooth" }); };

// A speech shows, before its words, what it put on the record: the role it
// claims and who it suspects. A long one has a summary folded under it, which
// the game master wrote and the speaker did not say. In the words, every player named
// stands out, the one suspected most.
function lineHTML(l, v, t) {
  const text = esc(l.text);
  if (l.kind === "speech") {
    const cls = ["msg", l.speaker === v.you && "mine", l.private && "private"].filter(Boolean).join(" ");
    const tag = l.private ? `<span class="tag wolf">${esc(v.pack ? t.packTag : t.secret)}</span>` : "";
    const sum = l.summary ? `<details class="sum"><summary title="${esc(t.line.summaryTip)}"><span class="lbl">${esc(t.line.summary)}</span><span class="pv">${esc(l.summary)}</span></summary>${esc(l.summary)}</details>` : "";
    return `<div class="${cls}" data-n="${l.n}">${avatar(l.speaker, true)}<div class="bubble"><div class="meta"><b>${esc(l.speaker)}</b>${tag}</div>` +
      stanceHTML(l, v, t) + `<div class="text">${mentions(text, l, v)}</div>` + sum + `</div></div>`;
  }
  if (l.kind === "death") return `<div class="event death">💀 ${text}</div>`;
  if (l.kind === "vote") return `<div class="event vote">🗳️ ${text}</div>`;
  if (l.kind === "result") return `<div class="event result">📣 ${text}</div>`;
  return `<div class="host${l.private ? " private" : ""}">${l.private ? esc(t.secret) + " · " : ""}${text}</div>`;
}

function stanceHTML(l, v, t) {
  if (!l.suspect) return l.stance ? `<div class="stance"><span class="chip">${esc(l.stance)}</span></div>` : "";
  const w = k => v.words[k] || k, out = [], c = l.claim;
  if (c && c.role) {
    const detail = c.role === "seer" && c.target ? t.line.checked(c.target, w(c.result)) : c.role === "witch" && c.target ? t.line.potion(c.target) : "";
    out.push(`<span class="pill claim${c.result === "werewolf" ? " wolfish" : ""}">🎭 ${esc(t.line.claims(w(c.role)))}${detail ? " · " + esc(detail) : ""}</span>`);
  }
  out.push(v.seats.some(s => s.name === l.suspect)
    ? `<span class="pill suspect">🎯 ${esc(t.line.suspects)} ${avatar(l.suspect, true)} ${esc(l.suspect)}</span>`
    : `<span class="pill suspect none">${esc(t.line.nobody)}</span>`);
  return `<div class="stance">${out.join("")}</div>`;
}

// mentions marks the players a speech names; text is already escaped. A Latin
// name only counts as a whole word, so "Ee" is not found inside "seer".
function mentions(text, l, v) {
  const names = v.seats.map(s => s.name).filter(n => n !== l.speaker).sort((a, b) => b.length - a.length);
  if (!names.length) return text;
  const re = new RegExp(names.map(n => `(?<![A-Za-z])${esc(n).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![A-Za-z])`).join("|"), "g");
  return text.replace(re, m => `<span class="at${m === esc(l.suspect || "") ? " hit" : ""}">${m}</span>`);
}

// foldSums keeps open the summaries of the latest few speeches and of the one
// being read aloud, and folds the rest; with every one asked for, it opens
// them all. One the reader opened or closed is left as they set it.
const OPEN_SPEECHES = 3;
let allSums = false;
function foldSums() {
  const recent = new Set([...$("log").querySelectorAll(".msg")].slice(-OPEN_SPEECHES));
  if (reading) recent.add($("log").querySelector(`.msg[data-n="${reading.n}"]`));
  for (const d of $("log").querySelectorAll(".sum")) {
    if (!d.dataset.set) d.open = allSums || recent.has(d.closest(".msg"));
  }
  $("logBar").hidden = !revealed || !$("log").querySelector(".sum");
}
$("log").addEventListener("click", e => {
  const s = e.target.closest(".sum summary");
  if (s) s.parentElement.dataset.set = "1";
});
function renderSumAll(t) {
  $("sumAll").textContent = allSums ? t.line.sumAuto : t.line.sumAll;
}
$("sumAll").onclick = () => {
  allSums = !allSums;
  for (const d of $("log").querySelectorAll(".sum")) delete d.dataset.set;
  foldSums();
  renderSumAll(UI[(view && view.lang) || "zh"]);
};

// renderStage shows what the table is waiting on: only what anyone at a real
// table could tell, which the game master has already narrowed it to.
let stageTimer = null;
function renderStage(v, t) {
  const s = t.stage, now = v.now, night = v.phase === "night";
  $("waiting").classList.toggle("night", night);
  let icon = "", text, sub = "";
  if (!now) {
    icon = night ? "💤" : "⏳";
    text = `<span class="dots">${esc(night ? s.nightIdle : t.waiting.replace(/[.…]+$/, ""))}</span>`;
    if (v.you && !v.alive) sub = t.dead;
  } else if (now.kind === "wolves") {
    icon = `<div class="eyes"><span></span><span></span></div>`;
    text = `<span class="dots">${esc(s.wolves)}</span>`; sub = s.wolvesSub;
  } else if (now.kind === "night" || now.kind === "wait") {
    icon = night ? "🦉" : "⏳";
    text = `<span class="dots">${esc(s[now.kind])}</span>`;
  } else if (now.name && (v.people || []).includes(now.name)) {
    icon = "⏳";
    text = `<span class="dots">${esc(s.person(now.name))}</span>`;
  } else if (now.name) {
    icon = now.kind === "badge" ? "🎖️" : "💭";
    const say = s[now.kind];
    text = `<span class="dots">${esc(typeof say === "function" ? say(now.name) : now.name)}</span>`;
    sub = s.ai;
  } else {
    icon = `<span class="ballot">🗳️</span>`;
    const say = s[now.kind]; // a line for one player, with nobody named, would print as source
    text = `<span class="dots">${esc(typeof say === "string" ? say : t.waiting.replace(/[.…]+$/, ""))}</span>`;
    if (now.waiting > 1) sub = s.left(now.waiting);
  }
  $("stageIcon").innerHTML = icon;
  $("stageText").innerHTML = text;
  stagePlain = $("stageText").textContent;
  renderReading();
  const since = now ? new Date(now.since) : null;
  const tick = () => {
    const secs = since ? Math.max(0, Math.round((Date.now() - since) / 1000)) : 0;
    $("stageSub").textContent = [sub, since ? s.elapsed(clock(secs)) : ""].filter(Boolean).join(" · ");
  };
  clearInterval(stageTimer);
  tick(); if (since) stageTimer = setInterval(tick, 1000);
}

// ---- votes ----
// Every result comes finished from the game master, outcome and all, and only
// once every vote is in; the page shows it and never works one out. A result
// that arrives while the page is open is revealed vote by vote; the ones
// there when it loads, after a refresh or a reconnect, are only listed, so
// nothing is replayed as if it had just happened. The panel holds a result
// back while it is being revealed, so it does not give the outcome away.
let seenVotes = null, votesShown = "";
function renderVotes(v, t) {
  const all = v.votes || [];
  if (seenVotes === null) seenVotes = new Set(all.map(r => r.key));
  const fresh = all.filter(r => !seenVotes.has(r.key));
  for (const r of fresh) seenVotes.add(r.key);
  const last = fresh.filter(r => r.votes).pop();
  if (last) revealVote(last, t, true);
  const held = revealing && revealing.fresh && !revealing.landed ? revealing.r.key : null;
  const rs = all.filter(r => r.key !== held);
  // What is being decided now comes first; the finished votes follow, the
  // latest labelled as the previous result, closed while another is under way.
  const live = v.now && t.vote.live[v.now.kind];
  $("votesNow").innerHTML = live ? `<b>${esc(live)}</b>${/vote/.test(v.now.kind) ? `<div class="dim">${esc(t.vote.liveNote)}</div>` : ""}` : "";
  $("votes").hidden = !rs.length && !live;
  const shown = v.lang + "|" + !!live + "|" + rs.map(r => r.key).join();
  if (shown !== votesShown) { // results never change once out, so redraw only for a new one and keep what is opened
    votesShown = shown;
    const c = $("votesList");
    c.innerHTML = rs.length ? `<div class="vr-title">${esc(t.vote.record)}</div>` + rs.map((r, i) => [r, i]).reverse().map(([r, i], n) =>
      `<details${n === 0 && !live ? " open" : ""}><summary>${n === 0 ? `<span class="prev">${esc(t.vote.previous)}</span> · ` : ""}${esc(voteTitle(r, t))} <span class="dim">· ${esc(outcomeText(r, t))}</span></summary>` +
      voteHTML(r, t, false) + (r.votes ? `<button type="button" class="secondary replay" data-i="${i}">${esc(t.vote.replay)}</button>` : "") + `</details>`).join("") : "";
    for (const b of c.querySelectorAll("button.replay")) b.onclick = () => revealVote(rs[+b.dataset.i], t);
  }
}

function voteTitle(r, t) { return r.pk ? (r.election ? t.vote.electionPkTitle : t.vote.pkTitle)(r.when, r.pk) : t.vote.title(r.when, !r.election ? "exile" : r.votes ? "election" : "race"); }
function nameList(xs, t) { return new Intl.ListFormat(t.vote.locale, { type: "conjunction" }).format(xs); }
function voteCount(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

function outcomeText(r, t) {
  const o = t.vote;
  switch (r.outcome) {
    case "tie": return (r.election ? o.electionTie : o.tie)(nameList(r.tied || [], t));
    case "pk": return o.pk(nameList(r.tied || [], t));
    case "abstained": return r.election ? o.electionAbstained : o.abstained;
    default: { const say = o[r.outcome]; return typeof say === "function" ? say(r.winner) : say || r.outcome; }
  }
}

// voteHTML draws a result: one row for each candidate, or for each player
// voted for, with its bar and count and who voted for them, then abstentions,
// then the outcome. Rows keep the order of the candidates, or of the first
// vote for each, so before the end their order gives nothing away; bars are
// out of every vote cast, for the same reason. Hidden, every vote and the
// outcome start out of sight for revealVote to bring in.
function voteHTML(r, t, hidden) {
  const votes = r.votes || [];
  const targets = [...(r.candidates || [])];
  for (const v of votes) if (v.target && !targets.includes(v.target)) targets.push(v.target);
  const totals = Object.fromEntries((r.totals || []).map(x => [x.target, x.votes]));
  const cast = votes.reduce((n, v) => n + v.weight, 0) || 1;
  const won = new Set(r.winner && r.votes ? [r.winner] : r.tied || []);
  const chip = (v, i) => {
    let chg = "";
    if (v.before !== undefined && v.before !== (v.target || "")) {
      chg = v.before === "" ? t.vote.wasAbstaining : v.target ? t.vote.switched(v.before) : t.vote.nowAbstains(v.before);
    }
    const cls = ["vr-chip", v.weight > 1 && "sheriff", chg && "changed", hidden && "wait"].filter(Boolean).join(" ");
    return `<span class="${cls}" data-i="${i}">${v.weight > 1 ? "🎖️ " : ""}${esc(v.voter)}${v.weight > 1 && v.target ? " ×1.5" : ""}` +
      (chg ? `<span class="chg">${esc(chg)}</span>` : "") + `</span>`;
  };
  const row = (target, cls) => {
    const mine = votes.map((v, i) => [v, i]).filter(([v]) => (v.target || "") === target);
    const n = hidden ? 0 : totals[target] || 0;
    const rowCls = ["vr-row", cls, !hidden && won.has(target) && (r.winner ? "win" : "tied"), r.election && "elected"].filter(Boolean).join(" ");
    return `<div class="${rowCls}" data-k="${esc(target)}"><div class="vr-name">${target ? avatar(target, true) : ""}<span>${esc(target || t.abstain)}</span></div>` +
      (target ? `<div class="vr-bar"><i style="width:${(100 * n / cast).toFixed(1)}%"></i></div><div class="vr-count">${voteCount(n)}</div>` : `<div></div><div></div>`) +
      `<div class="vr-voters">${mine.map(([v, i]) => chip(v, i)).join("")}</div></div>`;
  };
  const notes = [];
  if (r.candidates && r.candidates.length) notes.push(t.vote.candidates(nameList(r.candidates, t)) + (r.votes ? " · " + (r.pk && !r.election ? t.vote.pkNoVote : t.vote.noVote) : ""));
  if (r.withdrew && r.withdrew.length) notes.push(t.vote.withdrew(nameList(r.withdrew, t)));
  const abstained = votes.some(v => !v.target);
  return notes.map(n => `<div class="vr-note">${esc(n)}</div>`).join("") +
    (votes.length ? targets.map(x => row(x)).join("") + (abstained ? row("", "abstain") : "") : "") +
    `<div class="vr-outcome${r.outcome === "exiled" ? " exiled" : ""}${hidden ? " wait" : ""}" aria-live="polite">📣 ${esc(outcomeText(r, t))}</div>`;
}

// revealVote shows a result over the page: each vote lands in turn, its row's
// bar and count growing, then the outcome. Skipping, or a reader who prefers
// less motion, goes straight to the end. It closes itself a while after.
let revealing = null;
const STEP = 420;
function revealVote(r, t, fresh) {
  stopReveal();
  const body = $("revealBody"), timers = [];
  revealing = { r, t, timers, fresh };
  $("reveal").hidden = false;
  $("revealSkip").textContent = t.vote.skip; $("revealClose").textContent = t.vote.close;
  $("revealSkip").hidden = false;
  body.innerHTML = revealHead(r, t) + voteHTML(r, t, true);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { landReveal(); return; }
  const cast = r.votes.reduce((n, v) => n + v.weight, 0) || 1, counts = {};
  r.votes.forEach((v, i) => timers.push(setTimeout(() => {
    const chip = body.querySelector(`.vr-chip[data-i="${i}"]`);
    chip.classList.replace("wait", "pop");
    if (!v.target) return;
    counts[v.target] = (counts[v.target] || 0) + v.weight;
    const row = [...body.querySelectorAll(".vr-row")].find(x => x.dataset.k === v.target);
    row.querySelector(".vr-count").textContent = voteCount(counts[v.target]);
    row.querySelector(".vr-bar i").style.width = `${(100 * counts[v.target] / cast).toFixed(1)}%`;
  }, 500 + i * STEP)));
  timers.push(setTimeout(landReveal, 500 + r.votes.length * STEP + 500));
}

function landReveal() {
  if (!revealing) return;
  const { r, t, timers } = revealing;
  timers.forEach(clearTimeout); timers.length = 0;
  revealing.landed = true;
  if (revealing.fresh && view) renderVotes(view, t);
  $("revealBody").innerHTML = revealHead(r, t) + voteHTML(r, t, false);
  $("revealBody").querySelector(".vr-outcome").classList.add("landed");
  $("revealSkip").hidden = true;
  timers.push(setTimeout(closeReveal, 6000));
}

function revealHead(r, t) { return `<div class="vr-head" id="revealTitle">🗳️ ${esc(voteTitle(r, t))}</div>`; }
function stopReveal() { if (revealing) revealing.timers.forEach(clearTimeout); revealing = null; }
function closeReveal() { if (revealing && !revealing.landed) landReveal(); stopReveal(); $("reveal").hidden = true; }
$("revealSkip").onclick = landReveal;
$("revealClose").onclick = closeReveal;
$("reveal").onclick = e => { if (e.target === $("reveal")) closeReveal(); };
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || $("reveal").hidden) return;
  if (!$("revealSkip").hidden) landReveal(); else closeReveal();
});

function showTurn(p, t, w) {
  shownEvent = p.event;
  const turn = p.turn, k = turn.kind, f = $("turnForm");
  $("turnCard").hidden = false; $("turnErr").textContent = "";
  $("turnTitle").textContent = t.kinds[k] || k;
  const opts = (xs, blank) => (blank ? `<option value="">${t.none}</option>` : "") + xs.map(x => `<option value="${esc(x)}">${esc(w(x))}</option>`).join("");
  const choice = ["vote", "pk_vote", "wolf_vote", "wolf_revote", "protect", "inspect", "save", "poison", "shoot", "run", "withdraw", "sheriff_vote", "badge"].includes(k);
  const speaks = !choice, declares = ["speech", "campaign", "pk_speech"].includes(k);
  let h = "";
  if (k === "run") h += `<label>${t.target}</label><select name="target">${(turn.candidates || []).map(x => `<option value="${esc(x)}">${x === "pass" ? t.noRun : t.run}</option>`).join("")}</select>`;
  else if (k === "withdraw") h += `<label>${t.target}</label><select name="target">${(turn.candidates || []).map(x => `<option value="${esc(x)}">${x === "pass" ? t.withdraw : t.stay}</option>`).join("")}</select>`;
  else if (k === "protect") h += `<label>${t.target}</label><select name="target">${(turn.candidates || []).map(x => `<option value="${esc(x)}">${esc(x === "pass" ? t.guardNobody : w(x))}</option>`).join("")}</select>`;
  else if (k === "badge") h += `<label>${t.target}</label><select name="target">${(turn.candidates || []).map(x => `<option value="${esc(x)}">${esc(x === "pass" ? t.tearBadge : w(x))}</option>`).join("")}</select>`;
  else if (choice) h += `<label>${t.target}</label><select name="target">${opts(turn.candidates || [])}</select>`;
  if (k === "wolf_vote") {
    h += `<label>${t.volunteer}</label><select name="volunteer">${opts((turn.pack || []).length > 1 ? ["fake seer", "hook"] : ["fake seer"], true)}</select>`;
    h += `<label>${t.focus}</label><select name="focus">${opts(turn.suspects || [], true)}</select>`;
    h += `<label>${t.edge}</label><select name="edge">${opts(["power role", "villager"], true)}</select>`;
  }
  if (declares) {
    const others = turn.seats.map(s => s.name).filter(n => n !== turn.me.name);
    h += `<label>${t.suspect}</label><select name="suspect">${opts(turn.suspects || [])}</select>`;
    h += `<label>${t.claim}</label><select name="claimRole"><option value="">${t.noClaim}</option>${opts(boardOf(view) === "twelve" ? ["seer", "witch", "hunter", "guard", "villager"] : ["seer", "witch", "hunter", "villager"])}</select>`;
    h += `<div class="row" id="claimDetail"><div><label id="claimTargetLabel"></label><select name="claimTarget">${opts(others, true)}</select></div>`;
    h += `<div id="claimResultBox"><label>${t.claimResult}</label><select name="claimResult">${opts(["good", "werewolf"], true)}</select></div></div>`;
  }
  if (speaks) h += `<label>${t.speech}</label><textarea name="speech"></textarea>`;
  h += `<button type="submit">${t.submit}</button>`;
  f.innerHTML = h;
  if (speaks) addMic(f, view.lang, t);
  // A seer claim names who was checked and what they were; a witch claim names
  // who got a potion; other claims name nobody.
  const named = r => r === "seer" || r === "witch";
  if (declares) {
    const sync = () => {
      const r = f.elements.claimRole.value;
      $("claimDetail").hidden = !named(r);
      $("claimResultBox").hidden = r !== "seer";
      $("claimTargetLabel").textContent = r === "seer" ? t.claimChecked : t.claimPotion;
    };
    f.elements.claimRole.onchange = sync;
    sync();
  }
  f.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f)), a = {};
    for (const key of ["target", "speech", "suspect", "volunteer", "focus", "edge"]) if (d[key]) a[key] = d[key].trim();
    if (d.claimRole) a.claim = { role: d.claimRole, target: named(d.claimRole) ? d.claimTarget || "" : "", result: d.claimRole === "seer" ? d.claimResult || "" : "" };
    stopMic();
    f.querySelector("button[type=submit]").disabled = true;
    try { await api(`/api/games/${encodeURIComponent(gameId)}/moves${seatQuery}`, { event: p.event, action: a }); $("turnCard").hidden = true; }
    catch (err) { $("turnErr").textContent = err.message; f.querySelector("button[type=submit]").disabled = false; }
  };
  clearInterval(timer);
  const tick = () => {
    const s = Math.max(0, Math.round((new Date(p.deadline) - Date.now()) / 1000));
    $("countdown").textContent = t.timeLeft(clock(s));
    if (view && view.pending && view.pending.event === p.event) renderBar(view, t);
  };
  tick(); timer = setInterval(tick, 1000);
}

function finish(g) {
  clearInterval(timer);
  stopMic();
  clearInterval(stageTimer);
  $("turnCard").hidden = true; $("waiting").hidden = true; $("actionBar").hidden = true;
  const t = UI[(view && view.lang) || "zh"], r = $("result");
  r.hidden = false;
  if (g.error) { r.innerHTML = `<div class="err">${t.failed}${esc(g.error)}</div>`; return; }
  const res = g.result, w = k => (view && view.words[k]) || k;
  revealed = Object.fromEntries(res.players.map(p => [p.name, p.role]));
  renderSumAll(t);
  foldSums();
  if (view) renderSeats(view, t);
  r.innerHTML = `<div style="font-weight:700">${t.over} · ${esc(t.winner(w(res.winner)))}</div>` +
    (res.mvp && res.mvp.name ? `<p class="mvp">${t.mvp}: <b>${esc(res.mvp.name)}</b></p><p>${esc(res.mvp.reason)}</p>` : "") +
    `<a href="/"><button>${t.again}</button></a>`;

// ---- voice ----
// Read-aloud uses the browser's speech synthesis and voice input its speech
// recognition, so nothing is sent through the game master. Read-aloud starts
// off: browsers only let a page speak after the person has clicked something.
// While the microphone is on, new lines wait in held rather than being spoken,
// so the microphone does not pick them up. Chrome's speechSynthesis.pause and
// resume are not used: after a resume it often stays silent until cancelled.
const voice = { on: false, recording: false, held: [] };
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

$("voiceBtn").onclick = () => {
  voice.on = !voice.on;
  const lang = (view && view.lang) || "zh", t = UI[lang];
  $("voiceBtn").textContent = voice.on ? t.voiceOn : t.voiceOff;
  if (!voice.on) { speechSynthesis.cancel(); setReading(null); return; }
  // Said at once, so the person hears read-aloud works before the next line.
  speakLine({ text: t.voiceReady }, lang);
};
$("voiceBtn").hidden = !window.speechSynthesis;

// novelty is macOS's joke voices, which sing, wobble or whisper: hard to
// follow a whole speech in.
const novelty = new Set(["Albert", "Bad News", "Bahh", "Bells", "Boing", "Bubbles", "Cellos", "Good News",
  "Jester", "Organ", "Superstar", "Trinoids", "Whisper", "Wobble", "Zarvox"]);
const baseName = v => v.name.replace(/ \(.*\)$/, ""), tag = v => v.lang.replace("_", "-");

// Speaking voices by sex, best first: macOS's, then Chrome's own.
const sexes = {
  f: ["Shelley", "Sandy", "Flo", "Kathy", "Karen", "Moira", "Tessa", "Martha", "Catherine", "Nicky", "Grandma", "Samantha",
    "Google US English", "Google UK English Female", "Tingting", "Yu-shu", "Meijia", "Google 普通话（中国大陆）"],
  m: ["Aaron", "Daniel", "Eddy", "Reed", "Rocko", "Arthur", "Gordon", "Rishi", "Fred", "Ralph", "Junior", "Grandpa",
    "Google UK English Male", "Li-Mu"],
};

// cast is each character's voice: the ones to try first, their sex for when
// none of those is installed, and a pitch and pace for the persona. Mandarin
// has few voices, so its characters are told apart mostly by pitch and pace.
const cast = {
  "Karen": { sex: "f", voices: ["Karen", "Shelley"], pitch: 1.05, rate: 1.1 },
  "Florida Man": { sex: "m", voices: ["Rocko", "Eddy"], pitch: 1, rate: 1.1 },
  "Sigma Chad": { sex: "m", voices: ["Daniel", "Gordon"], pitch: 0.8, rate: 0.95 },
  "Discord Mod": { sex: "f", voices: ["Flo", "Kathy"], pitch: 1.05, rate: 1.05 },
  "LinkedIn Influencer": { sex: "m", voices: ["Aaron", "Arthur"], pitch: 1, rate: 1.05 },
  "Conspiracy Carl": { sex: "m", voices: ["Grandpa", "Ralph"], pitch: 1, rate: 1.1 },
  "Gym Bro": { sex: "m", voices: ["Eddy", "Reed"], pitch: 0.95, rate: 1.15 },
  "NPC Steve": { sex: "m", voices: ["Fred", "Ralph"], pitch: 1, rate: 1 },
  "Chronically Online Girl": { sex: "f", voices: ["Sandy", "Nicky"], pitch: 1.15, rate: 1.15 },
  "Sherlock Holmes": { sex: "m", voices: ["Daniel", "Arthur"], pitch: 0.95, rate: 1.1 },
  "Captain Jack Sparrow": { sex: "m", voices: ["Rocko", "Ralph"], pitch: 1, rate: 1.05 },
  "Wednesday Addams": { sex: "f", voices: ["Moira", "Tessa"], pitch: 0.85, rate: 0.9 },
  "SpongeBob SquarePants": { sex: "m", voices: ["Junior", "Fred"], pitch: 1.4, rate: 1.25 },
  "唐僧": { sex: "m", voices: ["Li-Mu"], pitch: 1.05, rate: 0.85 },
  "孙悟空": { sex: "m", voices: ["Li-Mu"], pitch: 1.25, rate: 1.25 },
  "猪八戒": { sex: "m", voices: ["Li-Mu"], pitch: 0.85, rate: 1.0 },
  "华妃": { sex: "f", voices: ["Tingting"], pitch: 1.15, rate: 1.1 },
  "安陵容": { sex: "f", voices: ["Yu-shu", "Tingting"], pitch: 1.25, rate: 0.95 },
  "皇后": { sex: "f", voices: ["Meijia", "Yu-shu"], pitch: 0.9, rate: 0.9 },
  "懒羊羊": { sex: "f", voices: ["Yu-shu", "Tingting"], pitch: 1.4, rate: 0.85 },
  "柯南": { sex: "m", voices: ["Li-Mu"], pitch: 1.3, rate: 1.15 },
  "派大星": { sex: "m", voices: ["Li-Mu"], pitch: 1.15, rate: 0.9 },
  "龙傲天": { sex: "m", voices: ["Li-Mu"], pitch: 0.75, rate: 1 },
  "摸鱼王": { sex: "m", voices: ["Li-Mu"], pitch: 1, rate: 1.2 },
  "闪电": { sex: "m", voices: ["Li-Mu"], pitch: 0.85, rate: 0.8 },
  "卡皮巴拉": { sex: "m", voices: ["Li-Mu"], pitch: 0.9, rate: 0.9 },

function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; }

// pickVoice is the first of names installed for the language, the exact
// accent (Mandarin over Cantonese, say) ahead of others.
function pickVoice(voices, names, want) {
  for (const n of names) {
    const v = voices.find(x => baseName(x) === n && tag(x) === want) || voices.find(x => baseName(x) === n);
    if (v) return v;
  }
  return null;
}

// speakLine reads a new line of the log aloud, each character in a voice of
// their own so the table can be followed by ear. Claim tags like
// 【声称预言家…】 are for reading, not for saying.
function speakLine(l, lang) {
  if (!voice.on || !window.speechSynthesis) return;
  const text = l.text.replace(/【[^】]*】|\[[^\]]*\]/g, "").trim();
  if (!text) return;
  if (voice.recording) { voice.held.push([l, lang]); return; }
  const u = new SpeechSynthesisUtterance(l.speaker ? `${l.speaker}：${text}` : text);
  u.lang = lang === "en" ? "en-US" : "zh-CN";
  const prefix = lang === "en" ? "en" : "zh";
  const voices = speechSynthesis.getVoices().filter(x => tag(x).startsWith(prefix) && !novelty.has(baseName(x)));
  const host = pickVoice(voices, [lang === "en" ? "Samantha" : "Tingting"], u.lang) ||
    voices.find(x => tag(x) === u.lang && x.default) || voices.find(x => tag(x) === u.lang) || voices[0];
  const c = cast[l.speaker];
  if (c) {
    u.voice = pickVoice(voices, [...c.voices, ...sexes[c.sex]], u.lang) || host;
    u.pitch = c.pitch;
    u.rate = c.rate;
  } else if (l.speaker) {
    // Someone not in the cast, a person's own name: a voice by their name.
    const h = hash(l.speaker), rest = voices.filter(x => x !== host);
    u.voice = rest.length ? rest[h % rest.length] : host;
    u.pitch = 0.8 + (h % 5) / 10;
    u.rate = 0.95 + ((h >>> 3) % 3) / 10;
  } else {
    u.voice = host;
  }
  if (l.speaker) {
    u.onstart = () => setReading(l);
    u.onend = u.onerror = () => { if (reading === l) setReading(null); };
  }
  speechSynthesis.speak(u);
}

// reading is the line being read aloud. Its speaker's seat shows them speaking
// and the line stands out, apart from whoever the table is waiting on, which
// is often the next player while the last one is still being read.
let reading = null;
function setReading(l) {
  reading = l;
  foldSums();
  for (const x of $("log").querySelectorAll(".msg.reading")) x.classList.remove("reading");
  if (l) { const m = $("log").querySelector(`.msg[data-n="${l.n}"]`); if (m) m.classList.add("reading"); }
  if (view) renderSeats(view, UI[view.lang] || UI.zh);
  renderReading();
}
function renderReading() {
  const t = UI[(view && view.lang) || "zh"];
  $("stageReading").textContent = reading ? t.stage.reading(reading.speaker) : "";
}

// addMic puts a voice-input button under the speech box: what the person says
// is typed into the box, where they can fix it before submitting. Read-aloud
// stops meanwhile and catches up afterwards.
function addMic(f, lang, t) {
  const box = f.elements.speech;
  if (!box || !Recognition) return;
  const b = document.createElement("button");
  b.type = "button"; b.className = "secondary"; b.textContent = t.mic;
  box.after(b);
  b.onclick = () => {
    if (rec) { stopMic(); return; }
    const before = box.value;
    rec = new Recognition();
    rec.lang = lang === "en" ? "en-US" : "zh-CN";
    rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => { box.value = before + [...e.results].map(x => x[0].transcript).join(""); };
    rec.onerror = e => { $("turnErr").textContent = t.micErrors[e.error] || t.micErr + e.error; };
    rec.onend = () => {
      rec = null; b.textContent = t.mic;
      voice.recording = false;
      for (const [l, lang] of voice.held.splice(0)) speakLine(l, lang);
    };
    voice.recording = true;
    if (window.speechSynthesis) speechSynthesis.cancel();
    setReading(null);
    $("turnErr").textContent = "";
    try { rec.start(); } catch (err) { $("turnErr").textContent = t.micErr + err.message; rec.onend(); return; }
    b.textContent = t.micStop;
  };
}

function stopMic() { if (rec) rec.stop(); }

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

if (gameId) {
  $("table").hidden = false;
  api("/api/avatars").then(r => { portraits = r.avatars || {}; }, () => {}).finally(poll);
}
else { $("setup").hidden = false; loadSetup(); }
</script>
